# CMI Follow-up's isolated local Supabase workspace.
# This is deliberately separate from /supabase, which contains historical
# ChurchConnect migrations and must never be applied to the CMI database.
project_id = "pcg-missions-cmi-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
