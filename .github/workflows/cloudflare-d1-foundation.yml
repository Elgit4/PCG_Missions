name: Cloudflare D1 Foundation

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-foundation.yml"
      - ".github/workflows/cloudflare-preview-deploy.yml"
      - ".github/workflows/cloudflare-d1-restore-rehearsal.yml"
      - ".github/workflows/cloudflare-production-worker-deploy.yml"
  push:
    branches: [main, 'migration/**', 'feat/**']
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-foundation.yml"
      - ".github/workflows/cloudflare-preview-deploy.yml"
      - ".github/workflows/cloudflare-d1-restore-rehearsal.yml"

permissions:
  contents: read

jobs:
  sqlite-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate D1 schema and security invariants
        run: python -m unittest discover -s cloudflare/tests -p "test_*.py" -v

  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare/package.json
      - name: Install pinned Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Type-check Worker and Better Auth integration
        run: npm run typecheck
      - name: Test Better Auth credential verification and session integration
        run: npm test
      - name: Validate preview and production Wrangler bundles and trigger configuration
        run: |
          npx wrangler deploy --env preview --dry-run --outdir /tmp/pcg-preview-worker-build
          test -s /tmp/pcg-preview-worker-build/index.js
          npx wrangler deploy --env production --dry-run --outdir /tmp/pcg-production-worker-build
          test -s /tmp/pcg-production-worker-build/index.js
      - name: Syntax-check authenticated acceptance harness
        run: node --check scripts/run_authenticated_acceptance.mjs
