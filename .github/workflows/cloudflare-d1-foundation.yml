name: Cloudflare D1 Foundation

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-foundation.yml"
      - "web/wrangler.toml"
  push:
    branches: [main, 'migration/**']
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate D1 schema and security invariants
        run: python -m unittest discover -s cloudflare/tests -p "test_*.py" -v

  worker-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare/package.json
      - name: Install pinned Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Type-check Worker and Better Auth integration
        run: npm run typecheck
      - name: Bundle Worker without deploying
        run: npm run build
      - name: Exercise Worker routes and Better Auth against local D1
        run: npm run test:integration

      # Never deploy from pull_request context. A push to the dedicated migration
      # branch (or a manual dispatch on that branch) is the only deployment path.
      - name: Require non-production deployment credentials
        if: github.ref == 'refs/heads/migration/cloudflare-nonprod-completion' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$BETTER_AUTH_SECRET" || { echo "::error::Missing repository secret BETTER_AUTH_SECRET."; exit 1; }
          test "${#BETTER_AUTH_SECRET}" -ge 32 || { echo "::error::BETTER_AUTH_SECRET must contain at least 32 characters."; exit 1; }

      - name: Apply pending migrations to EU non-production D1
        if: github.ref == 'refs/heads/migration/cloudflare-nonprod-completion' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply pcg-missions-dev --remote

      - name: Deploy isolated non-production Worker with secrets atomically
        if: github.ref == 'refs/heads/migration/cloudflare-nonprod-completion' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          set -eu
          umask 077
          secrets_file="$RUNNER_TEMP/pcg-worker-secrets.json"
          export SECRETS_FILE="$secrets_file"
          node <<'NODE'
          const fs = require("node:fs");
          const secrets = { BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET };
          if (process.env.RESEND_API_KEY) secrets.RESEND_API_KEY = process.env.RESEND_API_KEY;
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE
          trap 'rm -f "$secrets_file"' EXIT
          if [ -n "$EMAIL_FROM" ]; then
            npx wrangler deploy --secrets-file "$secrets_file" --var "EMAIL_FROM:$EMAIL_FROM"
          else
            npx wrangler deploy --secrets-file "$secrets_file"
          fi

      - name: Verify deployed Worker and EU D1 readiness
        if: github.ref == 'refs/heads/migration/cloudflare-nonprod-completion' && github.event_name != 'pull_request'
        env:
          WORKER_HEALTH_URL: https://pcg-missions-api-nonprod.pcg-missions-nonprod.workers.dev/health
          WORKER_API_URL: https://pcg-missions-api-nonprod.pcg-missions-nonprod.workers.dev/api/v1/me
          AUTH_SESSION_URL: https://pcg-missions-api-nonprod.pcg-missions-nonprod.workers.dev/api/auth/get-session
          FRONTEND_ORIGIN: https://pcg-missions-nonprod.pages.dev
        run: |
          set -eu
          ready=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$WORKER_HEALTH_URL" -o /tmp/worker-health.json; then
              if node -e 'const x=require("/tmp/worker-health.json"); process.exit(x.ok === true && x.environment === "non-production" && x.schema_version === 29 ? 0 : 1)'; then
                ready=1
                break
              fi
            fi
            echo "Worker not ready with EU D1 schema 29 yet (attempt $attempt/12)."
            sleep 5
          done
          test "$ready" -eq 1 || { cat /tmp/worker-health.json 2>/dev/null || true; echo "::error::Worker health did not confirm non-production D1 schema 29."; exit 1; }

          BOOTSTRAP_PAGE_URL=https://pcg-missions-api-nonprod.pcg-missions-nonprod.workers.dev/bootstrap
          bootstrap_page_status=$(curl --silent --dump-header /tmp/bootstrap-page.headers --output /tmp/bootstrap-page.html --write-out "%{http_code}" "$BOOTSTRAP_PAGE_URL")
          test "$bootstrap_page_status" = "200" || { cat /tmp/bootstrap-page.html; echo "::error::Non-production bootstrap page returned HTTP $bootstrap_page_status; expected 200."; exit 1; }
          grep -Fqi "content-type: text/html" /tmp/bootstrap-page.headers || { cat /tmp/bootstrap-page.headers; echo "::error::Bootstrap setup page did not return HTML."; exit 1; }
          grep -Fq "Secure account setup" /tmp/bootstrap-page.html || { echo "::error::Bootstrap setup page content is missing."; exit 1; }

          bootstrap_api_status=$(curl --silent --dump-header /tmp/bootstrap-api.headers --output /tmp/bootstrap-api.json --write-out "%{http_code}" -X POST "https://pcg-missions-api-nonprod.pcg-missions-nonprod.workers.dev/api/v1/bootstrap/first-admin" -H "Content-Type: application/json" --data '{"name":"Elvis","email":"elviskwakuboateng63@gmail.com","password":"Integration-Test-Only-Password!"}')
          test "$bootstrap_api_status" = "404" || { cat /tmp/bootstrap-api.json; echo "::error::Bootstrap API must reject a missing token with HTTP 404; got $bootstrap_api_status."; exit 1; }
          grep -Fqi "content-type: application/json" /tmp/bootstrap-api.headers || { cat /tmp/bootstrap-api.headers; echo "::error::Bootstrap API error response was not JSON."; exit 1; }
          node -e 'const x=require("/tmp/bootstrap-api.json"); process.exit(x.ok===false && x.error?.code==="BOOTSTRAP_UNAVAILABLE" ? 0 : 1)' || { cat /tmp/bootstrap-api.json; echo "::error::Bootstrap API missing-token response was unexpected."; exit 1; }

          pages_health_status=$(curl --silent --output /tmp/pages-health.json --write-out "%{http_code}" "$FRONTEND_ORIGIN/api/v1/health")
          test "$pages_health_status" = "200" || { cat /tmp/pages-health.json; echo "::error::Pages-to-Worker health proxy returned HTTP $pages_health_status; expected 200."; exit 1; }
          node -e 'const x=require("/tmp/pages-health.json"); process.exit(x.ok===true && x.environment==="non-production" && x.schema_version===29 ? 0 : 1)' || { cat /tmp/pages-health.json; echo "::error::Pages health proxy did not confirm non-production schema 29."; exit 1; }

          api_status=$(curl --silent --output /tmp/worker-me.json --write-out "%{http_code}" "$WORKER_API_URL")
          test "$api_status" = "401" || { cat /tmp/worker-me.json; echo "::error::Unauthenticated staff-context gate returned HTTP $api_status; expected 401."; exit 1; }

          session_status=$(curl --silent --output /tmp/worker-session.json --write-out "%{http_code}" "$FRONTEND_ORIGIN/api/auth/get-session" -H "Origin: $FRONTEND_ORIGIN")
          test "$session_status" = "200" || { cat /tmp/worker-session.json; echo "::error::Better Auth session endpoint returned HTTP $session_status; expected 200 for an unauthenticated session lookup."; exit 1; }

          cors_status=$(curl --silent --dump-header /tmp/worker-cors.headers --output /tmp/worker-cors.body --write-out "%{http_code}" -X OPTIONS "$WORKER_API_URL" -H "Origin: $FRONTEND_ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: content-type,x-branch-id")
          test "$cors_status" = "204" || { cat /tmp/worker-cors.body; echo "::error::Allowed-origin CORS preflight returned HTTP $cors_status; expected 204."; exit 1; }
          grep -Fqi "access-control-allow-origin: $FRONTEND_ORIGIN" /tmp/worker-cors.headers || { cat /tmp/worker-cors.headers; echo "::error::Allowed frontend origin was not reflected in CORS headers."; exit 1; }

          denied_status=$(curl --silent --dump-header /tmp/worker-denied.headers --output /tmp/worker-denied.body --write-out "%{http_code}" -X OPTIONS "$WORKER_API_URL" -H "Origin: https://not-allowed.invalid" -H "Access-Control-Request-Method: GET")
          test "$denied_status" = "403" || { cat /tmp/worker-denied.body; echo "::error::Disallowed-origin preflight returned HTTP $denied_status; expected 403."; exit 1; }
          if grep -qi "^access-control-allow-origin:" /tmp/worker-denied.headers; then
            cat /tmp/worker-denied.headers
            echo "::error::Disallowed origin received an Access-Control-Allow-Origin header."
            exit 1
          fi
          echo "Verified Worker health, D1 schema 29, unauthenticated API denial, Better Auth session endpoint, allowed-origin CORS and disallowed-origin rejection."

      - name: Preserve non-production Worker bundle for deployment review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcg-missions-worker-bundle
          path: cloudflare/build/
          if-no-files-found: warn
          retention-days: 3
