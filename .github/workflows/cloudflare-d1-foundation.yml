name: Cloudflare D1 Foundation

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-foundation.yml"
  push:
    branches: [main, 'migration/**']
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-d1-foundation.yml"

permissions:
  contents: read

jobs:
  sqlite-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate D1 schema and security invariants
        run: python -m unittest discover -s cloudflare/tests -p "test_*.py" -v

  worker-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare/package.json
      - name: Install pinned Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Type-check Worker and Better Auth integration
        run: npm run typecheck
      - name: Bundle Worker without deploying
        run: npm run build
      - name: Exercise Worker routes and Better Auth against local D1
        run: npm run test:integration
      - name: Apply pending migrations to EU non-production D1
        if: github.ref == 'refs/heads/migration/cloudflare-nonprod-completion'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; remote D1 migrations were not applied."
            exit 0
          fi
          npx wrangler d1 migrations apply pcg-missions-dev --remote
      - name: Deploy isolated non-production Worker
        if: github.ref == 'refs/heads/migration/cloudflare-nonprod-completion'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; non-production deployment was not attempted."
            exit 0
          fi
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::notice::BETTER_AUTH_SECRET is not configured; full API Worker deployment was not attempted."
            exit 0
          fi
          printf "%s" "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
          if [ -n "$RESEND_API_KEY" ]; then
            printf "%s" "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          fi
          if [ -n "$EMAIL_FROM" ]; then
            npx wrangler deploy --var "EMAIL_FROM:$EMAIL_FROM"
          else
            npx wrangler deploy
          fi
      - name: Preserve non-production Worker bundle for deployment review
        uses: actions/upload-artifact@v4
        with:
          name: pcg-missions-worker-bundle
          path: cloudflare/build/
          if-no-files-found: error
          retention-days: 1
