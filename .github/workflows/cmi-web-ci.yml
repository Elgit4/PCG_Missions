name: CMI web CI

on:
  push:
    branches: [main, feat/team-area-administration-mainline]
    paths:
      - "web/**"
      - ".github/workflows/cmi-web-ci.yml"
  pull_request:
    branches:
      - main
      - "feat/team-area-administration-mainline"
      - "feat/cmi-*"
    paths:
      - "web/**"
      - ".github/workflows/cmi-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmi-web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: CMI frontend typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production assets
        run: npm run build
