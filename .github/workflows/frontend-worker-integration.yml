name: Frontend Worker Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "cloudflare/src/**"
      - ".github/workflows/frontend-worker-integration.yml"
  push:
    branches:
      - migration/cloudflare-nonprod-completion
    paths:
      - "web/**"
      - "cloudflare/src/**"
      - ".github/workflows/frontend-worker-integration.yml"

permissions:
  contents: read
  deployments: write

jobs:
  frontend:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build preview artifact
        run: npm run build
      # Re-deploy after Pages project runtime configuration changes.
      - name: Deploy non-production frontend directly to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/cloudflare-nonprod-completion'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1697f36d4227453d2e25cfb49b347e5f"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_PAGES_API_TOKEN. Create a Cloudflare API token with Account > Cloudflare Pages > Edit and add it as a GitHub Actions secret."; exit 1; }
          npx --yes wrangler@4.162.0 pages deploy dist \
            --project-name pcg-missions-nonprod \
            --branch migration/cloudflare-nonprod-completion \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy PCG Missions non-production frontend $GITHUB_SHA"
