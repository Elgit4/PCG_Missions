name: Team Leader Authenticated Acceptance

on:
  push:
    branches:
      - verify/team-leader-authenticated-acceptance
    paths:
      - ".github/workflows/team-leader-authenticated-acceptance.yml"
      - "cloudflare/src/index.ts"
      - "cloudflare/scripts/run_authenticated_acceptance.mjs"
      - "cloudflare/migrations/**"

permissions:
  contents: read

concurrency:
  group: pcg-missions-team-leader-authenticated-acceptance
  cancel-in-progress: false

jobs:
  isolated-eu-acceptance:
    name: Full D1 restore and authenticated API acceptance
    uses: ./.github/workflows/cloudflare-d1-restore-rehearsal.yml
    secrets: inherit
