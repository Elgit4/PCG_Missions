name: Cloudflare Preview Worker Smoke

on:
  push:
    branches:
      - artifacts/pcg-missions-preview-worker

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview Worker health against EU D1
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          body="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$url/health")"
          echo "$body"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.ok!==true || p.environment!=="non-production" || p.schema_version!==39) process.exit(1)' "$body"

      - name: Verify protected staff context rejects anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          status="$(curl --silent --show-error -o /tmp/me.json -w "%{http_code}" "$url/api/v1/me")"
          cat /tmp/me.json
          test "$status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/me.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'

      - name: Verify preview CORS and idempotency headers
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev/api/v1/contacts"
          headers="$(curl --silent --show-error -D - -o /dev/null -X OPTIONS "$url" \
            -H "Origin: https://feat-cloudflare-d1-migration.pcg-missions.pages.dev" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type,x-branch-id,idempotency-key")"
          printf '%s\n' "$headers"
          grep -qi "access-control-allow-origin: https://feat-cloudflare-d1-migration.pcg-missions.pages.dev" <<< "$headers"
          grep -qi "idempotency-key" <<< "$headers"
