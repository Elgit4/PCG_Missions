name: RETIRED — Legacy Cloudflare Preview Smoke

# Superseded by the health, session, and anonymous-boundary checks in
# cloudflare-preview-deploy.yml. Retained only as an audit artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retired preview smoke workflow
        run: |
          echo "This legacy artifact-branch smoke workflow is retired."
          echo "The active preview release workflow performs the current schema 48 health and anonymous-boundary checks."
          echo "No D1, Worker, Pages, Supabase or SMS changes were made."
