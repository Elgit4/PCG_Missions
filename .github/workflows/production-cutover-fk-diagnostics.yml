name: Production Cutover Foreign-Key Diagnostics

on:
  push:
    branches:
      - verify/production-cutover-fk-diagnostics
    paths:
      - ".github/workflows/production-cutover-fk-diagnostics.yml"
      - "cloudflare/src/index.ts"
      - "cloudflare/scripts/run_authenticated_acceptance.mjs"
      - "cloudflare/migrations/**"

permissions:
  contents: read

concurrency:
  group: pcg-missions-production-cutover-fk-diagnostics
  cancel-in-progress: false

jobs:
  isolated-eu-acceptance:
    name: Full D1 restore and authenticated API acceptance
    uses: ./.github/workflows/cloudflare-d1-restore-rehearsal.yml
    secrets: inherit
