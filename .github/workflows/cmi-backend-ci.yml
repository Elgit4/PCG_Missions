name: CMI backend CI

on:
  push:
    branches:
      - main
    paths:
      - "supabase-cmi/**"
      - ".github/workflows/cmi-backend-ci.yml"
  pull_request:
    branches:
      - main
      - "feat/cmi-*"
      - "design/cmi-*"
      - "backend/cmi-*"
      - "fix/cmi-*"
    paths:
      - "supabase-cmi/**"
      - ".github/workflows/cmi-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmi-backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cmi-database-tests:
    name: CMI local migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting for changed CMI Edge Function files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No comparison base is available for this event; skipping the diff-scoped formatting check."
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'supabase-cmi/supabase/functions/*.ts' 'supabase-cmi/supabase/functions/**/*.ts')"
          if [[ -z "$changed_files" ]]; then
            echo "No CMI Edge Function TypeScript files changed."
            exit 0
          fi

          while IFS= read -r file; do
            deno fmt --check "$file"
          done <<< "$changed_files"

      - name: Lint CMI Edge Functions
        run: deno lint supabase-cmi/supabase/functions

      - name: Type-check public-content Edge Function
        run: deno check supabase-cmi/supabase/functions/public-content/index.ts

      - name: Test public-content request validation
        run: deno test supabase-cmi/supabase/functions/public-content/validation_test.ts

      - name: Type-check staff session Edge Function
        run: deno check supabase-cmi/supabase/functions/staff-session/index.ts

      - name: Test staff session projection and fail-closed permissions
        run: deno test supabase-cmi/supabase/functions/staff-session/session_test.ts

      - name: Type-check staff access operations Edge Function
        run: deno check supabase-cmi/supabase/functions/staff-access-operations/index.ts

      - name: Test staff access request validation
        run: deno test supabase-cmi/supabase/functions/staff-access-operations/validation_test.ts

      - name: Test staff access CORS preflight response
        run: deno test supabase-cmi/supabase/functions/staff-access-operations/http_test.ts

      - name: Type-check staff authentication Edge Function
        run: deno check supabase-cmi/supabase/functions/staff-auth/index.ts

      - name: Test staff authentication request validation
        run: deno test supabase-cmi/supabase/functions/staff-auth/validation_test.ts

      - name: Test one-time administrator bootstrap state decisions
        run: deno test supabase-cmi/supabase/functions/staff-auth/bootstrap_state_test.ts

      - name: Test complete Auth user pagination for bootstrap
        run: deno test supabase-cmi/supabase/functions/staff-auth/auth_users_test.ts

      - name: Test staff authentication CORS preflight
        run: deno test supabase-cmi/supabase/functions/staff-auth/http_test.ts

      - name: Type-check staff operations Edge Function
        run: deno check supabase-cmi/supabase/functions/staff-operations/index.ts

      - name: Test staff operations request validation
        run: deno test supabase-cmi/supabase/functions/staff-operations/validation_test.ts

      - name: Type-check event operations Edge Function
        run: deno check supabase-cmi/supabase/functions/event-operations/index.ts

      - name: Test event draft request validation
        run: deno test supabase-cmi/supabase/functions/event-operations/validation_test.ts

      - name: Type-check announcement operations Edge Function
        run: deno check supabase-cmi/supabase/functions/announcement-operations/index.ts

      - name: Test announcement draft request validation
        run: deno test supabase-cmi/supabase/functions/announcement-operations/validation_test.ts

      - name: Type-check content operations Edge Function
        run: deno check supabase-cmi/supabase/functions/content-operations/index.ts

      - name: Test content draft request validation
        run: deno test supabase-cmi/supabase/functions/content-operations/validation_test.ts

      - name: Type-check calendar operations Edge Function
        run: deno check supabase-cmi/supabase/functions/calendar-operations/index.ts

      - name: Test calendar request validation
        run: deno test supabase-cmi/supabase/functions/calendar-operations/validation_test.ts

      - name: Type-check pastoral operations Edge Function
        run: deno check supabase-cmi/supabase/functions/pastoral-operations/index.ts

      - name: Test pastoral read request validation
        run: deno test supabase-cmi/supabase/functions/pastoral-operations/validation_test.ts

      - name: Test server-side event idempotency helpers
        run: deno test supabase-cmi/supabase/functions/_shared/idempotency_test.ts

      - name: Type-check Hubtel SMS provider adapter
        run: deno check supabase-cmi/supabase/functions/_shared/sms/hubtel.ts

      - name: Test Hubtel SMS provider adapter
        run: deno test supabase-cmi/supabase/functions/_shared/sms/hubtel_test.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Show CLI version
        run: supabase --version

      - name: Assert the isolated CMI CLI project layout
        run: |
          test -f supabase-cmi/supabase/config.toml
          test -f supabase-cmi/supabase/migrations/20261108010000_cmi_identity_authorization_foundation.sql
          test -f supabase-cmi/supabase/tests/identity_authorization_foundation.test.sql
          test ! -e supabase-cmi/supabase/migrations/20261107001200_churchconnect_core_schema.sql

      - name: Generate temporary CLI migrations from reviewed schema drafts
        run: |
          set -euo pipefail

          supabase --workdir supabase-cmi migration new cmi_contacts_followup_domain
          contacts_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_contacts_followup_domain.sql' -print -quit)"
          test -n "$contacts_migration"
          cp supabase-cmi/schema-drafts/contacts_followup_domain.sql "$contacts_migration"

          # Supabase migration filenames use second-resolution timestamps.
          sleep 1
          supabase --workdir supabase-cmi migration new cmi_restricted_pastoral_domain
          pastoral_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_restricted_pastoral_domain.sql' -print -quit)"
          test -n "$pastoral_migration"
          cp supabase-cmi/schema-drafts/restricted_pastoral_domain.sql "$pastoral_migration"

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_events_attendance_public_content
          events_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_events_attendance_public_content.sql' -print -quit)"
          test -n "$events_migration"
          cp supabase-cmi/schema-drafts/events_attendance_public_content.sql "$events_migration"

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_backend_capability_catalogue
          capability_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_backend_capability_catalogue.sql' -print -quit)"
          test -n "$capability_migration"
          cp supabase-cmi/schema-drafts/backend_capability_catalogue.sql "$capability_migration"

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_followup_task_operations
          followup_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_followup_task_operations.sql' -print -quit)"
          test -n "$followup_migration"
          cp supabase-cmi/schema-drafts/followup_task_operations.sql "$followup_migration"

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_pastoral_read_operations
          pastoral_read_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_pastoral_read_operations.sql' -print -quit)"
          test -n "$pastoral_read_migration"
          cp supabase-cmi/schema-drafts/pastoral_read_operations.sql "$pastoral_read_migration"

          cp supabase-cmi/schema-drafts/backend_capability_catalogue.test.sql supabase-cmi/supabase/tests/cmi_backend_capability_catalogue.test.sql

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_staff_access_lifecycle
          access_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_staff_access_lifecycle.sql' -print -quit)"
          test -n "$access_migration"
          cp supabase-cmi/schema-drafts/staff_access_lifecycle.sql "$access_migration"
          cp supabase-cmi/schema-drafts/staff_access_lifecycle.test.sql supabase-cmi/supabase/tests/cmi_staff_access_lifecycle.test.sql

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_staff_auth_lifecycle
          auth_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_staff_auth_lifecycle.sql' -print -quit)"
          test -n "$auth_migration"
          cp supabase-cmi/schema-drafts/staff_auth_lifecycle.sql "$auth_migration"
          cp supabase-cmi/schema-drafts/staff_auth_lifecycle.test.sql supabase-cmi/supabase/tests/cmi_staff_auth_lifecycle.test.sql

          cp supabase-cmi/schema-drafts/followup_task_operations.test.sql supabase-cmi/supabase/tests/cmi_followup_task_operations.test.sql
          cp supabase-cmi/schema-drafts/contacts_followup_domain.test.sql supabase-cmi/supabase/tests/cmi_contacts_followup_domain.test.sql
          cp supabase-cmi/schema-drafts/restricted_pastoral_domain.test.sql supabase-cmi/supabase/tests/cmi_restricted_pastoral_domain.test.sql
          cp supabase-cmi/schema-drafts/events_attendance_public_content.test.sql supabase-cmi/supabase/tests/cmi_events_attendance_public_content.test.sql
          cp supabase-cmi/schema-drafts/pastoral_read_operations.test.sql supabase-cmi/supabase/tests/cmi_pastoral_read_operations.test.sql

      - name: Start isolated local CMI stack and apply CMI migrations
        run: supabase --workdir supabase-cmi start

      - name: Run CMI database tests
        run: supabase --workdir supabase-cmi test db

      - name: Stop isolated local CMI stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase --workdir supabase-cmi stop || true
          else
            echo "Supabase CLI was not installed; no local CMI stack was started."
          fi
          rm -f supabase-cmi/supabase/migrations/*_cmi_contacts_followup_domain.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_restricted_pastoral_domain.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_events_attendance_public_content.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_backend_capability_catalogue.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_staff_access_lifecycle.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_staff_auth_lifecycle.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_followup_task_operations.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_pastoral_read_operations.sql
          rm -f supabase-cmi/supabase/tests/cmi_backend_capability_catalogue.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_staff_access_lifecycle.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_staff_auth_lifecycle.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_followup_task_operations.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_contacts_followup_domain.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_restricted_pastoral_domain.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_events_attendance_public_content.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_pastoral_read_operations.test.sql
