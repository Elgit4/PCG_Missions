name: CMI backend database tests

on:
  push:
    branches:
      - feat/cmi-backend-foundation
    paths:
      - "supabase-cmi/**"
      - ".github/workflows/cmi-backend-ci.yml"
  pull_request:
    branches:
      - design/cmi-logical-data-model
      - main
    paths:
      - "supabase-cmi/**"
      - ".github/workflows/cmi-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmi-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmi-database-tests:
    name: CMI local migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Show CLI version
        run: supabase --version

      - name: Assert the isolated CMI CLI project layout
        run: |
          test -f supabase-cmi/supabase/config.toml
          test -f supabase-cmi/supabase/migrations/20261108010000_cmi_identity_authorization_foundation.sql
          test -f supabase-cmi/supabase/tests/identity_authorization_foundation.test.sql
          test ! -e supabase-cmi/supabase/migrations/20261107001200_churchconnect_core_schema.sql

      - name: Start isolated local CMI stack and apply CMI migrations
        run: supabase --workdir supabase-cmi start

      - name: Run CMI database tests
        run: supabase --workdir supabase-cmi test db

      - name: Stop isolated local CMI stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase --workdir supabase-cmi stop
          else
            echo "Supabase CLI was not installed; no local CMI stack was started."
          fi
