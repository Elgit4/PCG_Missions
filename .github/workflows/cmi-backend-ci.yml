name: CMI backend database tests

on:
  pull_request:
    branches:
      - design/cmi-logical-data-model
      - main
      - feat/cmi-backend-foundation
      - feat/cmi-events-attendance-public-content
      - feat/cmi-public-content-edge-api
    paths:
      - "supabase-cmi/**"
      - ".github/workflows/cmi-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmi-backend-ci-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  cmi-database-tests:
    name: CMI local migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check public-content Edge Function
        run: deno check supabase-cmi/supabase/functions/public-content/index.ts

      - name: Test public-content request validation
        run: deno test supabase-cmi/supabase/functions/public-content/validation_test.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Show CLI version
        run: supabase --version

      - name: Assert the isolated CMI CLI project layout
        run: |
          test -f supabase-cmi/supabase/config.toml
          test -f supabase-cmi/supabase/migrations/20261108010000_cmi_identity_authorization_foundation.sql
          test -f supabase-cmi/supabase/tests/identity_authorization_foundation.test.sql
          test ! -e supabase-cmi/supabase/migrations/20261107001200_churchconnect_core_schema.sql

      - name: Generate temporary CLI migrations from reviewed schema drafts
        run: |
          set -euo pipefail

          supabase --workdir supabase-cmi migration new cmi_contacts_followup_domain
          contacts_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_contacts_followup_domain.sql' -print -quit)"
          test -n "$contacts_migration"
          cp supabase-cmi/schema-drafts/contacts_followup_domain.sql "$contacts_migration"

          # Supabase migration filenames use second-resolution timestamps.
          sleep 1
          supabase --workdir supabase-cmi migration new cmi_restricted_pastoral_domain
          pastoral_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_restricted_pastoral_domain.sql' -print -quit)"
          test -n "$pastoral_migration"
          cp supabase-cmi/schema-drafts/restricted_pastoral_domain.sql "$pastoral_migration"

          sleep 1
          supabase --workdir supabase-cmi migration new cmi_events_attendance_public_content
          events_migration="$(find supabase-cmi/supabase/migrations -maxdepth 1 -type f -name '*_cmi_events_attendance_public_content.sql' -print -quit)"
          test -n "$events_migration"
          cp supabase-cmi/schema-drafts/events_attendance_public_content.sql "$events_migration"

          cp supabase-cmi/schema-drafts/contacts_followup_domain.test.sql supabase-cmi/supabase/tests/cmi_contacts_followup_domain.test.sql
          cp supabase-cmi/schema-drafts/restricted_pastoral_domain.test.sql supabase-cmi/supabase/tests/cmi_restricted_pastoral_domain.test.sql
          cp supabase-cmi/schema-drafts/events_attendance_public_content.test.sql supabase-cmi/supabase/tests/cmi_events_attendance_public_content.test.sql

      - name: Start isolated local CMI stack and apply CMI migrations
        run: supabase --workdir supabase-cmi start

      - name: Run CMI database tests
        run: supabase --workdir supabase-cmi test db

      - name: Stop isolated local CMI stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase --workdir supabase-cmi stop || true
          else
            echo "Supabase CLI was not installed; no local CMI stack was started."
          fi
          rm -f supabase-cmi/supabase/migrations/*_cmi_contacts_followup_domain.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_restricted_pastoral_domain.sql
          rm -f supabase-cmi/supabase/migrations/*_cmi_events_attendance_public_content.sql
          rm -f supabase-cmi/supabase/tests/cmi_contacts_followup_domain.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_restricted_pastoral_domain.test.sql
          rm -f supabase-cmi/supabase/tests/cmi_events_attendance_public_content.test.sql
