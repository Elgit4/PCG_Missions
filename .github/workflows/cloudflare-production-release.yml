name: PCG Missions Cloudflare Production Release

on:
  push:
    branches:
      - migration/cloudflare-auth-consolidation
    paths:
      - "cloudflare/PRODUCTION_RELEASE_APPROVED"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to authorize the production D1 migration and Pages cutover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pcg-missions-cloudflare-production-release
  cancel-in-progress: false

jobs:
  production-release:
    if: ${{ github.event_name == 'push' || inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: "1697f36d4227453d2e25cfb49b347e5f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the reviewed migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-auth-consolidation

      - name: Set up Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run migration, security, type and Worker tests
        working-directory: .
        run: |
          python -m unittest discover -s cloudflare/tests -p "test_*.py" -v
          cd cloudflare
          npm run typecheck
          npm test

      - name: Verify release credentials and production database target
        shell: bash
        env:
          SUPABASE_SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${SUPABASE_SOURCE_DB_URL:-}" || { echo "::error::SUPABASE_SOURCE_DB_URL is missing"; exit 1; }
          npx wrangler whoami

      - name: Build exact production Worker bundle
        run: |
          rm -rf dist
          npx wrangler deploy --env production --dry-run --outdir dist
          test -s dist/index.js
          node --check dist/index.js

      - name: Install PostgreSQL client for one-time credential bridge
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply the forward-only schema migrations through version 45
        run: npx wrangler d1 migrations apply pcg-missions-production --remote --env production

      - name: Promote only the verified schema 45 database to production
        run: |
          set -euo pipefail
          npx wrangler d1 execute pcg-missions-production --remote --env production --command "UPDATE app_meta SET environment='production' WHERE id=1 AND schema_version=45 AND environment='non-production'"
          npx wrangler d1 execute pcg-missions-production --remote --env production --command "SELECT CASE WHEN schema_version=45 AND environment='production' THEN 'PRODUCTION_D1_READY' ELSE 'PRODUCTION_D1_NOT_READY' END AS release_gate FROM app_meta WHERE id=1" --json > /tmp/pcg-production-meta.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/pcg-production-meta.json","utf8"));const rows=x[0]?.results||x.result?.[0]?.results||[];if(!rows.some(r=>r.release_gate==="PRODUCTION_D1_READY"))process.exit(1)'

      - name: Import and verify existing staff bcrypt credentials in production D1
        env:
          SUPABASE_SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
          PCG_MISSIONS_PRODUCTION_D1_ID: "2bbfb04f-9182-427d-b269-d050b8a9403f"
        run: python scripts/import_supabase_auth_credentials_production.py

      - name: Provision persistent production auth and flyer-storage secrets
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npx wrangler deploy --env production
          secrets_json="$(npx wrangler secret list --env production)"
          if ! printf '%s' "$secrets_json" | jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' >/dev/null; then
            openssl rand -hex 32 | npx wrangler secret put BETTER_AUTH_SECRET --env production >/dev/null
          fi
          if [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production >/dev/null
          fi
          secrets_json="$(npx wrangler secret list --env production)"
          printf '%s' "$secrets_json" | jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' >/dev/null

      - name: Deploy production Better Auth and D1 Worker
        run: npx wrangler deploy --env production

      - name: Verify production Worker health, auth boundary and CORS
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-production.pcg-missions-nonprod.workers.dev"
          health="$(curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$url/health")"
          echo "$health"
          node -e 'const p=JSON.parse(process.argv[1]);if(p.ok!==true||p.environment!=="production"||p.schema_version!==45)process.exit(1)' "$health"
          me_status="$(curl --silent --show-error -o /tmp/pcg-me.json -w "%{http_code}" "$url/api/v1/me")"
          test "$me_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/pcg-me.json","utf8"));if(p.error?.code!=="UNAUTHENTICATED")process.exit(1)'
          session_status="$(curl --silent --show-error -o /tmp/pcg-session.json -w "%{http_code}" "$url/api/auth/get-session")"
          test "$session_status" = "200"
          cors="$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS "$url/api/auth/sign-in/email" -H "Origin: https://pcg-missions.pages.dev" -H "Access-Control-Request-Method: POST")"
          test "$cors" = "204"

      - name: Verify private event-flyer storage secret before live Pages cutover
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --env production)"
          if ! printf '%s' "$secrets_json" | jq -e 'any(.[]; .name == "SUPABASE_SERVICE_ROLE_KEY")' >/dev/null; then
            echo "::error title=Event flyer storage key missing::The production Better Auth Worker is deployed and healthy, but Pages cutover is held until the existing Supabase service-role key is securely provisioned as the production Worker secret SUPABASE_SERVICE_ROLE_KEY. The event-flyer storage exception must remain functional."
            exit 1
          fi

      - name: Verify Pages production branch and Cloudflare API configuration
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/pcg-missions"
          project="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          printf '%s' "$project" | jq -e '
            .success == true and
            .result.production_branch == "migration/cloudflare-auth-consolidation" and
            .result.source.config.production_branch == "migration/cloudflare-auth-consolidation" and
            .result.deployment_configs.production.env_vars.PCG_MISSIONS_API_ORIGIN.value == "https://pcg-missions-api-production.pcg-missions-nonprod.workers.dev" and
            (.result.deployment_configs.production.env_vars | has("SUPABASE_URL") | not) and
            (.result.deployment_configs.production.env_vars | has("SUPABASE_PUBLISHABLE_KEY") | not)
          '

      - name: Build and deploy reviewed frontend to production Pages
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          test -s dist/index.html
          npx wrangler pages deploy dist --project-name pcg-missions --branch migration/cloudflare-auth-consolidation

      - name: Wait for production Pages deployment and verify public app
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/pcg-missions/deployments"
          ready=0
          for attempt in $(seq 1 30); do
            deployments="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?env=production&per_page=5")"
            status="$(printf '%s' "$deployments" | jq -r '[.result[] | select(.environment=="production")] | first | .latest_stage.status // empty')"
            if [ "$status" = "success" ]; then ready=1; break; fi
            if [ "$status" = "failure" ]; then printf '%s' "$deployments" | jq '.result[0]'; exit 1; fi
            sleep 10
          done
          test "$ready" = "1"
          curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error https://pcg-missions.pages.dev/ >/dev/null
          curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error https://pcg-missions.pages.dev/api/v1/health | tee /tmp/pages-api-health.json
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/pages-api-health.json","utf8"));if(p.ok!==true||p.environment!=="production"||p.schema_version!==45)process.exit(1)'
          curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error https://pcg-missions.pages.dev/api/auth/get-session >/dev/null
          echo "PCG Missions production Pages and Better Auth Worker passed release smoke checks."
