name: RETIRED — Initial PCG Missions Cloudflare Cutover

# The one-time initial cutover completed successfully on 22 November 2026.
# This workflow is intentionally retained as an audit artifact but can no
# longer run. Future Worker changes use cloudflare-production-worker-deploy.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retired cutover workflow
        run: |
          echo "::error::The one-time Cloudflare cutover workflow is retired and cannot be rerun."
          echo "Use .github/workflows/cloudflare-production-worker-deploy.yml for guarded Worker releases."
          echo "Cloudflare Pages frontend changes deploy through the Pages Git integration."
          echo "No database, secret, Worker, Pages, Supabase or SMS changes were made."
          exit 1
