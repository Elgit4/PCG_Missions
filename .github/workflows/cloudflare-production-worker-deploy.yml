name: Cloudflare Production Worker Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY-PRODUCTION to authorize a guarded production Worker release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pcg-missions-production-worker-release
  cancel-in-progress: false

jobs:
  production-worker:
    name: Validate, migrate and deploy the production Worker
    if: ${{ github.ref == 'refs/heads/migration/cloudflare-auth-consolidation' && inputs.confirm_production == 'DEPLOY-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: "1697f36d4227453d2e25cfb49b347e5f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://pcg-missions-api-production.pcg-missions-nonprod.workers.dev
      PAGES_URL: https://pcg-missions.pages.dev

    steps:
      - name: Check out the reviewed production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require exact production confirmation and Cloudflare credential
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/migration/cloudflare-auth-consolidation"
          test "$CONFIRMATION" = "DEPLOY-PRODUCTION"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4.166.0 whoami

      - name: Require current preview, Worker and frontend acceptance before production mutation
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          require_successful_current_code_run() {
            local workflow_file="$1"
            local label="$2"
            local scope="$3"
            local jq_filter runs accepted sha
            jq_filter=".workflow_runs[] | select(.path == \".github/workflows/${workflow_file}\" and .conclusion == \"success\") | .head_sha"
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="migration/cloudflare-auth-consolidation" -F per_page=100 --jq "$jq_filter")"
            accepted=""
            while IFS= read -r sha; do
              [[ -z "$sha" ]] && continue
              if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
                continue
              fi
              if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
                continue
              fi
              if [[ "$scope" == "cloudflare" ]] && ! git diff --quiet "$sha" "$GITHUB_SHA" -- cloudflare; then
                continue
              fi
              if [[ "$scope" == "web" ]] && ! git diff --quiet "$sha" "$GITHUB_SHA" -- web; then
                continue
              fi
              accepted="$sha"
              break
            done <<< "$runs"
            if [[ -z "$accepted" ]]; then
              echo "::error title=Production acceptance gate blocked::$label has no successful run against the exact current $scope source tree."
              exit 1
            fi
            echo "$label accepted at $accepted"
          }

          require_successful_current_code_run "cloudflare-d1-foundation.yml" "Cloudflare D1 Foundation" "cloudflare"
          require_successful_current_code_run "cmi-web-ci.yml" "CMI web CI" "web"
          # The preview workflow includes the full isolated D1 restore rehearsal,
          # six-role authenticated acceptance, preview Worker deployment and session smoke test.
          require_successful_current_code_run "cloudflare-preview-deploy.yml" "Cloudflare Auth Preview Release" "cloudflare"

      - name: Verify deployed preview authentication before production mutation
        shell: bash
        run: |
          set -euo pipefail
          preview="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          health="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$preview/health")"
          echo "$health"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.ok!==true || p.environment!=="non-production" || p.schema_version!==46 || p.auth_configuration!=="ready") process.exit(1)' "$health"
          me_status="$(curl --silent --show-error -o /tmp/pcg-preview-me.json -w "%{http_code}" "$preview/api/v1/me")"
          test "$me_status" = "401"
          session_status="$(curl --silent --show-error -o /tmp/pcg-preview-session.json -w "%{http_code}" "$preview/api/auth/get-session")"
          test "$session_status" = "200"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/pcg-preview-session.json","utf8")); if(p===null || (typeof p!=="object")) process.exit(1)'
          echo "Preview Worker health, anonymous boundary, and Better Auth session endpoint passed."
      - name: Install pinned Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run migration, security, type and Worker tests
        working-directory: .
        run: |
          python -m unittest discover -s cloudflare/tests -p "test_*.py" -v
          cd cloudflare
          npm run typecheck
          npm test

      - name: Build and verify Pages frontend before production mutation
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Verify Pages upload permission with a non-production preflight deployment
        working-directory: web
        run: |
          ../cloudflare/node_modules/.bin/wrangler pages project list
          ../cloudflare/node_modules/.bin/wrangler pages deploy dist \
            --project-name pcg-missions \
            --branch "production-preflight-${GITHUB_RUN_ID}" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "PCG Missions non-production Pages upload preflight"

      - name: Verify exact production D1 target and environment before mutation
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "SELECT schema_version, environment, (SELECT COUNT(*) FROM d1_migrations) AS migration_count, (SELECT MIN(id) FROM d1_migrations) AS first_migration_id, (SELECT MAX(id) FROM d1_migrations) AS latest_migration_id, (SELECT SUM(id) FROM d1_migrations) AS migration_id_sum FROM app_meta WHERE id = 1" > /tmp/pcg-d1-before.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = JSON.parse(fs.readFileSync("/tmp/pcg-d1-before.json", "utf8"));
          const candidates = [];
          function walk(value) {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value)) return value.forEach(walk);
            if (Object.hasOwn(value, "schema_version")) candidates.push(value);
            Object.values(value).forEach(walk);
          }
          walk(root);
          const row = candidates[0];
          if (!row || row.environment !== "production" ||
              ![45, 46].includes(Number(row.schema_version)) ||
              Number(row.schema_version) !== Number(row.latest_migration_id) ||
              Number(row.migration_count) !== Number(row.schema_version) ||
              Number(row.first_migration_id) !== 1 ||
              Number(row.migration_id_sum) !== Number(row.schema_version) * (Number(row.schema_version) + 1) / 2) {
            throw new Error("Production D1 marker/schema/migration ledger mismatch; refusing deployment.");
          }
          console.log(JSON.stringify({
            environment: row.environment,
            schema_version: row.schema_version,
            latest_migration_id: row.latest_migration_id
          }));
          NODE

      - name: Require reconciled six-role production staff roster before cutover
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "
            SELECT
              (SELECT COUNT(*) FROM staff_profile WHERE account_status='active' AND deactivated_at IS NULL) AS active_staff_profiles,
              (SELECT COUNT(*) FROM user) AS auth_users,
              (SELECT COUNT(DISTINCT userId) FROM account WHERE password IS NOT NULL) AS password_users,
              (SELECT COUNT(*) FROM role) AS role_catalogue_entries,
              (SELECT COUNT(*) FROM staff_role_assignment a JOIN staff_profile s ON s.id=a.staff_profile_id
                WHERE a.revoked_at IS NULL AND (a.ends_at IS NULL OR datetime(a.ends_at)>datetime('now'))
                  AND datetime(a.starts_at)<=datetime('now') AND s.account_status='active' AND s.deactivated_at IS NULL) AS active_role_assignments,
              (SELECT COUNT(DISTINCT a.staff_profile_id) FROM staff_role_assignment a JOIN staff_profile s ON s.id=a.staff_profile_id
                WHERE a.revoked_at IS NULL AND (a.ends_at IS NULL OR datetime(a.ends_at)>datetime('now'))
                  AND datetime(a.starts_at)<=datetime('now') AND s.account_status='active' AND s.deactivated_at IS NULL) AS assigned_staff_profiles,
              (SELECT COUNT(DISTINCT r.code) FROM staff_role_assignment a JOIN role r ON r.id=a.role_id JOIN staff_profile s ON s.id=a.staff_profile_id
                WHERE a.revoked_at IS NULL AND (a.ends_at IS NULL OR datetime(a.ends_at)>datetime('now'))
                  AND datetime(a.starts_at)<=datetime('now') AND s.account_status='active' AND s.deactivated_at IS NULL) AS assigned_role_codes,
              (SELECT COUNT(*) FROM staff_profile s WHERE s.account_status='active' AND s.deactivated_at IS NULL
                AND NOT EXISTS (SELECT 1 FROM staff_role_assignment a WHERE a.staff_profile_id=s.id
                  AND a.revoked_at IS NULL AND (a.ends_at IS NULL OR datetime(a.ends_at)>datetime('now'))
                  AND datetime(a.starts_at)<=datetime('now'))) AS active_profiles_without_role,
              (SELECT COUNT(*) FROM staff_role_assignment a JOIN staff_profile s ON s.id=a.staff_profile_id
                WHERE a.revoked_at IS NULL AND (a.ends_at IS NULL OR datetime(a.ends_at)>datetime('now'))
                  AND datetime(a.starts_at)<=datetime('now') AND (s.account_status<>'active' OR s.deactivated_at IS NOT NULL)) AS assignments_on_inactive_profiles,
              (SELECT COUNT(*) FROM staff_profile s WHERE s.account_status='active' AND s.deactivated_at IS NULL
                AND s.must_change_password=1 AND (s.password_setup_expires_at IS NULL
                  OR datetime(s.password_setup_expires_at)<datetime('now'))) AS invalid_first_login_setups,
              (SELECT COUNT(*) FROM staff_profile s LEFT JOIN user u ON u.id=s.auth_user_id
                WHERE s.account_status='active' AND s.deactivated_at IS NULL
                  AND (u.id IS NULL OR NOT EXISTS (SELECT 1 FROM account a WHERE a.userId=u.id AND a.password IS NOT NULL))) AS active_staff_without_credential,
              (SELECT COUNT(*) FROM (
                SELECT r.code
                FROM staff_role_assignment a JOIN role r ON r.id=a.role_id JOIN staff_profile s ON s.id=a.staff_profile_id
                WHERE a.revoked_at IS NULL AND (a.ends_at IS NULL OR datetime(a.ends_at)>datetime('now'))
                  AND datetime(a.starts_at)<=datetime('now') AND s.account_status='active' AND s.deactivated_at IS NULL
                  AND r.code IN ('admin_pastor','coordinator','team_leader','field_worker','follow_up_volunteer','prayer_intercessor')
                GROUP BY r.code HAVING COUNT(DISTINCT a.staff_profile_id)=1
              )) AS roles_with_one_active_assignee
          " > /tmp/pcg-production-staff-roster.json

          node - /tmp/pcg-production-staff-roster.json <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const candidates = [];
          const visit = (value) => {
            if (Array.isArray(value)) return value.forEach(visit);
            if (!value || typeof value !== "object") return;
            if (Object.hasOwn(value, "active_staff_profiles")) candidates.push(value);
            Object.values(value).forEach(visit);
          };
          visit(payload);
          const row = candidates[0];
          if (!row) {
            console.error("Production staff-roster query returned no summary row.");
            process.exit(1);
          }
          const expected = {
            active_staff_profiles: 6,
            role_catalogue_entries: 6,
            active_role_assignments: 6,
            assigned_staff_profiles: 6,
            assigned_role_codes: 6,
            active_profiles_without_role: 0,
            assignments_on_inactive_profiles: 0,
            invalid_first_login_setups: 0,
            active_staff_without_credential: 0,
            roles_with_one_active_assignee: 6,
          };
          const failures = Object.entries(expected).filter(([key, value]) => Number(row[key]) !== value);
          if (Number(row.auth_users) < 6 || Number(row.password_users) < 6) {
            failures.push(["auth_users/password_users", "at least 6 each"]);
          }
          console.log(JSON.stringify({
            active_staff_profiles: Number(row.active_staff_profiles),
            auth_users: Number(row.auth_users),
            password_users: Number(row.password_users),
            role_catalogue_entries: Number(row.role_catalogue_entries),
            active_role_assignments: Number(row.active_role_assignments),
            assigned_staff_profiles: Number(row.assigned_staff_profiles),
            assigned_role_codes: Number(row.assigned_role_codes),
            active_profiles_without_role: Number(row.active_profiles_without_role),
            assignments_on_inactive_profiles: Number(row.assignments_on_inactive_profiles),
            invalid_first_login_setups: Number(row.invalid_first_login_setups),
            active_staff_without_credential: Number(row.active_staff_without_credential),
            roles_with_one_active_assignee: Number(row.roles_with_one_active_assignee),
          }, null, 2));
          if (failures.length) {
            console.error("Production cutover blocked: the six-user launch roster is not reconciled. Activate six staff accounts, assign exactly one active staff member to each of the six roles, resolve inactive-profile assignments, and reset expired first-login credentials before release.");
            process.exit(1);
          }
          NODE

      - name: Verify existing production Worker secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --env production > /tmp/pcg-production-secrets.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/pcg-production-secrets.json", "utf8"));
          const names = new Set((Array.isArray(value) ? value : value.result ?? []).map(item => item.name));
          for (const required of ["BETTER_AUTH_SECRET", "SUPABASE_SERVICE_ROLE_KEY"]) {
            if (!names.has(required)) throw new Error("Required production Worker secret is missing: " + required);
          }
          console.log("Required production Worker secret names are present; secret values were not read or printed.");
          NODE

      - name: Build exact production Worker bundle before touching D1
        run: |
          rm -rf dist
          npx wrangler deploy --env production --dry-run --outdir dist
          test -s dist/index.js
          node --check dist/index.js

      - name: Record the pre-release production D1 Time Travel bookmark
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info pcg-missions-production --env production --json > /tmp/pcg-production-bookmark.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/pcg-production-bookmark.json", "utf8"));
          const text = JSON.stringify(value);
          if (!text.includes("bookmark")) throw new Error("Cloudflare did not return a production D1 bookmark.");
          console.log("Pre-release D1 bookmark captured. It is retained as a workflow artifact; no restore was requested.");
          NODE

      - name: Apply only pending forward-only production migrations
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx wrangler d1 migrations apply pcg-missions-production --remote --env production 2>&1 | tee /tmp/pcg-production-migrations.log
          migration_status=${PIPESTATUS[0]}
          set -e
          if [[ "$migration_status" -ne 0 ]] && grep -Eiq "7500|daily row write limit|free tier" /tmp/pcg-production-migrations.log; then
            reset_at="$(date -u -d 'tomorrow 00:05:00' +%s)"
            now="$(date -u +%s)"
            wait_seconds=$((reset_at - now))
            if [[ "$wait_seconds" -le 0 || "$wait_seconds" -gt 18000 ]]; then
              echo "::error title=D1 free-tier daily write limit::Cloudflare D1 returned code 7500. Re-run after the UTC quota reset or use a paid D1 plan."
              exit 1
            fi
            echo "::warning title=D1 daily write quota exhausted::Waiting until 00:05 UTC for the account's daily row-write quota to reset, then retrying the same forward-only production migration."
            sleep "$wait_seconds"
            npx wrangler d1 migrations apply pcg-missions-production --remote --env production
          elif [[ "$migration_status" -ne 0 ]]; then
            exit "$migration_status"
          fi

      - name: Verify production schema and migration ledger after migration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "SELECT schema_version, environment, (SELECT COUNT(*) FROM d1_migrations) AS migration_count, (SELECT MIN(id) FROM d1_migrations) AS first_migration_id, (SELECT MAX(id) FROM d1_migrations) AS latest_migration_id, (SELECT SUM(id) FROM d1_migrations) AS migration_id_sum FROM app_meta WHERE id = 1" > /tmp/pcg-d1-after.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = JSON.parse(fs.readFileSync("/tmp/pcg-d1-after.json", "utf8"));
          const candidates = [];
          function walk(value) {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value)) return value.forEach(walk);
            if (Object.hasOwn(value, "schema_version")) candidates.push(value);
            Object.values(value).forEach(walk);
          }
          walk(root);
          const row = candidates[0];
          if (!row || row.environment !== "production" ||
              Number(row.schema_version) !== 46 ||
              Number(row.latest_migration_id) !== 46 ||
              Number(row.migration_count) !== 46 ||
              Number(row.schema_version) !== Number(row.latest_migration_id) ||
              Number(row.migration_count) !== Number(row.schema_version) ||
              Number(row.first_migration_id) !== 1 ||
              Number(row.migration_id_sum) !== Number(row.schema_version) * (Number(row.schema_version) + 1) / 2) {
            throw new Error("Post-migration production marker/schema/ledger mismatch.");
          }
          console.log(JSON.stringify({
            environment: row.environment,
            schema_version: row.schema_version,
            latest_migration_id: row.latest_migration_id
          }));
          NODE

      - name: Verify production D1 write budget for Better Auth session storage
        shell: bash
        run: |
          set -euo pipefail
          probe_id="pcg-rate-limit-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe_key="pcg-rate-limit-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          insert_sql="INSERT INTO rateLimit (id,key,count,lastRequest) VALUES ('${probe_id}','${probe_key}',1,$(date -u +%s%3N))"
          delete_sql="DELETE FROM rateLimit WHERE id='${probe_id}'"

          wait_for_quota_reset() {
            reset_at="$(date -u -d '00:05 tomorrow' +%s)"
            now="$(date -u +%s)"
            wait_seconds=$((reset_at - now))
            if [[ "$wait_seconds" -le 0 || "$wait_seconds" -gt 18000 ]]; then
              echo "::error title=D1 free-tier daily write limit::Cloudflare D1 row-write quota is exhausted outside the supported five-hour wait window."
              return 1
            fi
            echo "::warning title=D1 daily write quota exhausted::Waiting until 00:05 UTC before retrying the production rate-limit write probe."
            sleep "$wait_seconds"
          }

          run_probe_sql() {
            local sql="$1"
            local log_file="$2"
            set +e
            npx wrangler d1 execute pcg-missions-production --remote --env production --command "$sql" 2>&1 | tee "$log_file"
            local status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -ne 0 ]] && grep -Eiq "7500|daily row write limit|free tier" "$log_file"; then
              return 75
            fi
            return "$status"
          }

          if run_probe_sql "$insert_sql" /tmp/pcg-production-write-probe-insert.log; then
            :
          else
            status=$?
            if [[ "$status" -ne 75 ]]; then exit "$status"; fi
            wait_for_quota_reset
            run_probe_sql "$insert_sql" /tmp/pcg-production-write-probe-insert-retry.log
          fi

          if run_probe_sql "$delete_sql" /tmp/pcg-production-write-probe-delete.log; then
            :
          else
            status=$?
            if [[ "$status" -ne 75 ]]; then exit "$status"; fi
            wait_for_quota_reset
            run_probe_sql "$delete_sql" /tmp/pcg-production-write-probe-delete-retry.log
          fi

      - name: Deploy reviewed Worker code to production
        run: npx wrangler deploy --env production

      - name: Deploy reviewed frontend and Pages Functions to production
        working-directory: web
        run: |
          ../cloudflare/node_modules/.bin/wrangler pages deploy dist \
            --project-name pcg-missions \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "PCG Missions production release $GITHUB_SHA"

      - name: Deploy reviewed frontend assets to Pages production
        working-directory: web
        run: |
          ../cloudflare/node_modules/.bin/wrangler pages deploy dist \
            --project-name pcg-missions \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "PCG Missions production release $GITHUB_SHA"

      - name: Verify direct Worker and same-origin Pages production endpoints
        shell: bash
        run: |
          set -euo pipefail
          direct_health="$(curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent --show-error --max-time 30 "$WORKER_URL/health")"
          printf '%s\n' "$direct_health"
          node -e 'const p=JSON.parse(process.argv[1]);if(p.ok!==true||p.environment!=="production"||p.schema_version!==46||p.auth_configuration!=="ready")process.exit(1)' "$direct_health"

          for base in "$WORKER_URL" "$PAGES_URL"; do
            status="$(curl --silent --show-error --output /tmp/pcg-me.json --write-out "%{http_code}" --max-time 20 "$base/api/v1/me")"
            test "$status" = "401"
            node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/pcg-me.json","utf8"));if(p.error?.code!=="UNAUTHENTICATED")process.exit(1)'
          done

          session_status="$(curl --silent --show-error --output /tmp/pcg-session.json --write-out "%{http_code}" --max-time 20 "$PAGES_URL/api/auth/get-session")"
          test "$session_status" = "200"

          api_health="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error --max-time 20 "$PAGES_URL/api/v1/health")"
          node -e 'const p=JSON.parse(process.argv[1]);if(p.ok!==true||p.environment!=="production"||p.schema_version!==46||p.auth_configuration!=="ready")process.exit(1)' "$api_health"

          cors_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 20 -X OPTIONS "$WORKER_URL/api/auth/sign-in/email" -H "Origin: https://pcg-missions.pages.dev" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type")"
          test "$cors_status" = "204"
          echo "Production Worker, same-origin Pages proxy, anonymous authorization boundary, Better Auth session endpoint and CORS checks passed."

      - name: Retain production release evidence and D1 bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcg-missions-production-worker-release-${{ github.run_id }}
          path: |
            /tmp/pcg-production-bookmark.json
            /tmp/pcg-d1-before.json
            /tmp/pcg-d1-after.json
          if-no-files-found: warn
          retention-days: 90
