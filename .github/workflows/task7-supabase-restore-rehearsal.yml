name: Task 7 — Supabase logical backup and isolated restore

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_restore:
        description: "Type RESTORE-TO-ISOLATED-SUPABASE to authorize restore to the separate target project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pcg-missions-task7-supabase-restore
  cancel-in-progress: false

jobs:
  backup-and-restore:
    if: ${{ inputs.confirm_isolated_restore == 'RESTORE-TO-ISOLATED-SUPABASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require independent source and restore connection strings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SOURCE_DB_URL" || {
            echo "::error::Add SUPABASE_SOURCE_DB_URL as a repository Actions secret."
            exit 1
          }
          test -n "$SUPABASE_RESTORE_DB_URL" || {
            echo "::error::Add SUPABASE_RESTORE_DB_URL as a repository Actions secret for a separate, disposable Supabase project."
            exit 1
          }
          if [[ "$SUPABASE_SOURCE_DB_URL" == "$SUPABASE_RESTORE_DB_URL" ]]; then
            echo "::error::Source and restore connection strings must be different."
            exit 1
          fi
          source_identity="$(python -c 'import os,urllib.parse; u=urllib.parse.urlparse(os.environ["SUPABASE_SOURCE_DB_URL"]); print((u.hostname or "")+"|"+(u.username or ""))')"
          target_identity="$(python -c 'import os,urllib.parse; u=urllib.parse.urlparse(os.environ["SUPABASE_RESTORE_DB_URL"]); print((u.hostname or "")+"|"+(u.username or ""))')"
          if [[ "$source_identity" == "|" || "$target_identity" == "|" || "$source_identity" == "$target_identity" ]]; then
            echo "::error::Could not prove that source and restore endpoints are distinct. Use connection strings from two different Supabase projects."
            exit 1
          fi
          echo "Source and target are configured as distinct database endpoints."

          # GitHub-hosted runners may not have IPv6 egress. Supabase direct
          # db.<project-ref>.supabase.co endpoints resolve to IPv6 on some
          # projects; use the IPv4-compatible Session Pooler for dump/restore.
          for label in SOURCE RESTORE; do
            if [[ "$label" == "SOURCE" ]]; then url="$SUPABASE_SOURCE_DB_URL"; else url="$SUPABASE_RESTORE_DB_URL"; fi
            endpoint="$(DB_URL="$url" python -c 'import os,urllib.parse; u=urllib.parse.urlparse(os.environ["DB_URL"]); print((u.hostname or "")+"|"+str(u.port or 5432))')"
            host="${endpoint%%|*}"
            port="${endpoint##*|}"
            if [[ "$host" != *.pooler.supabase.com || "$port" != "5432" ]]; then
              echo "::error::$label database URL must use the Supabase Session Pooler (pooler hostname, port 5432). Direct db.<project-ref>.supabase.co and Transaction Pooler port 6543 are not supported by this restore rehearsal."
              echo "::error::In the relevant Supabase project, open Connect, choose Session pooler, copy the URI, replace its password locally, then update the matching GitHub secret."
              exit 1
            fi
          done

      - name: Install Supabase CLI and PostgreSQL client
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify restore target is a fresh empty public schema
        shell: bash
        run: |
          set -euo pipefail
          public_count="$(psql "$SUPABASE_RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m');")"
          history_count="$(psql "$SUPABASE_RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='supabase_migrations' AND c.relkind IN ('r','p','v','m');")"
          if [[ "$public_count" != "0" || "$history_count" != "0" ]]; then
            echo "::error::Restore target is not fresh (public relations=$public_count; migration-history relations=$history_count). Refusing to overwrite it."
            exit 1
          fi
          echo "Restore target public and Supabase migration-history schemas are empty."

      - name: Create Supabase-aware logical backup on ephemeral runner disk
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_SOURCE_DB_URL" -f /tmp/cmi-roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_SOURCE_DB_URL" -f /tmp/cmi-schema.sql
          supabase db dump --db-url "$SUPABASE_SOURCE_DB_URL" -f /tmp/cmi-data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          # Supabase excludes migration history from the ordinary project dump; preserve it explicitly.
          supabase db dump --db-url "$SUPABASE_SOURCE_DB_URL" --schema supabase_migrations -f /tmp/cmi-history-schema.sql
          supabase db dump --db-url "$SUPABASE_SOURCE_DB_URL" --schema supabase_migrations -f /tmp/cmi-history-data.sql --use-copy --data-only
          test -s /tmp/cmi-roles.sql
          test -s /tmp/cmi-schema.sql
          test -s /tmp/cmi-data.sql
          test -s /tmp/cmi-history-schema.sql
          test -s /tmp/cmi-history-data.sql
          sha256sum /tmp/cmi-roles.sql /tmp/cmi-schema.sql /tmp/cmi-data.sql /tmp/cmi-history-schema.sql /tmp/cmi-history-data.sql

      - name: Restore only to the isolated Supabase target
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_RESTORE_DB_URL" \
            --single-transaction \
            --set ON_ERROR_STOP=1 \
            --file /tmp/cmi-roles.sql \
            --command 'ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated' \
            --file /tmp/cmi-schema.sql \
            --command 'SET session_replication_role = replica' \
            --file /tmp/cmi-data.sql \
            --file /tmp/cmi-history-schema.sql \
            --file /tmp/cmi-history-data.sql

      - name: Compare restored public schema and critical CMI row counts
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT 'public_tables' AS item, count(*)::bigint AS row_count FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' UNION ALL SELECT 'capability', count(*) FROM public.capability UNION ALL SELECT 'role_capability', count(*) FROM public.role_capability UNION ALL SELECT 'staff_access_audit', count(*) FROM public.staff_access_audit UNION ALL SELECT 'role', count(*) FROM public.role UNION ALL SELECT 'staff_profile', count(*) FROM public.staff_profile UNION ALL SELECT 'migration_history', count(*) FROM supabase_migrations.schema_migrations"
          psql "$SUPABASE_SOURCE_DB_URL" -X -v ON_ERROR_STOP=1 -AtF '|' -c "$SQL" | sort > /tmp/cmi-source-counts.txt
          psql "$SUPABASE_RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 -AtF '|' -c "$SQL" | sort > /tmp/cmi-target-counts.txt
          diff -u /tmp/cmi-source-counts.txt /tmp/cmi-target-counts.txt
          psql "$SUPABASE_SOURCE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" > /tmp/cmi-source-migration-versions.txt
          psql "$SUPABASE_RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" > /tmp/cmi-target-migration-versions.txt
          diff -u /tmp/cmi-source-migration-versions.txt /tmp/cmi-target-migration-versions.txt
          echo "Supabase restore verification passed: public table count, critical CMI row counts, and exact migration-version history match."

      - name: Remove logical backup files from ephemeral runner
        if: always()
        run: rm -f /tmp/cmi-roles.sql /tmp/cmi-schema.sql /tmp/cmi-data.sql /tmp/cmi-history-schema.sql /tmp/cmi-history-data.sql /tmp/cmi-source-counts.txt /tmp/cmi-target-counts.txt /tmp/cmi-source-migration-versions.txt /tmp/cmi-target-migration-versions.txt
