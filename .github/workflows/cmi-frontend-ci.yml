name: CMI frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cmi-frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cmi-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmi-frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build
