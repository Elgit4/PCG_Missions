name: CMI frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cmi-frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cmi-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cmi-frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve and lock patched lint dependencies
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit

      - name: Upload refreshed dependency lockfile
        uses: actions/upload-artifact@v7
        with:
          name: cmi-frontend-package-lock
          path: web/package-lock.json
          retention-days: 1

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const totals = report.metadata?.vulnerabilities ?? {};
          console.log("Dependency audit totals:", JSON.stringify(totals));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? [])
              .filter((entry) => typeof entry === "object")
              .map((entry) => entry.title)
              .join("; ");
            console.log(
              `${name}: severity=${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; advisories=${advisories}`
            );
          }
          NODE

      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      # Temporary one-time lockfile commit for this first-party remediation branch.
      - name: Commit the tested dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cmi-frontend-production-integration'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The dependency lockfile is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(web): commit audited dependency lockfile"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
