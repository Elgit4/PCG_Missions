name: CMI frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cmi-frontend-ci.yml"
  push:
    branches: [main, feat/team-area-administration-mainline]
    paths:
      - "web/**"
      - ".github/workflows/cmi-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmi-frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const totals = report.metadata?.vulnerabilities ?? {};
          console.log("Dependency audit totals:", JSON.stringify(totals));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? [])
              .filter((entry) => typeof entry === "object")
              .map((entry) => entry.title)
              .join("; ");
            console.log(
              `${name}: severity=${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; advisories=${advisories}`
            );
          }
          NODE

      - name: Fail on moderate-or-higher dependency advisories
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

