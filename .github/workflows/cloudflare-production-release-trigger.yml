name: Authorised PCG Missions Production Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/production/DEPLOY-PRODUCTION"

permissions:
  contents: read
  actions: read

concurrency:
  group: pcg-missions-production-release-authorized-trigger
  cancel-in-progress: false

jobs:
  release:
    name: Invoke the full guarded production release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/cloudflare-production-worker-deploy.yml
    with:
      confirm_production: DEPLOY-PRODUCTION
    secrets: inherit
