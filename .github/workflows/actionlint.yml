name: Validate GitHub Actions workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - migration/cloudflare-auth-consolidation
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7 -color
