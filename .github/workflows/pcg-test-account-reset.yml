name: Owner-approved removal of PCG Missions test logins

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type REMOVE-TEST-LOGINS to authorize this one-time production credential cleanup
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pcg-missions-production-test-account-reset-v4
  cancel-in-progress: false

jobs:
  remove-test-logins:
    name: Preserve ministry history and release the two test email addresses
    if: ${{ inputs.confirm_production == 'REMOVE-TEST-LOGINS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: "1697f36d4227453d2e25cfb49b347e5f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require exact one-time production confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "REMOVE-TEST-LOGINS"

      - name: Check out the reviewed cleanup and migration scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js and install the pinned Worker tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare access
        working-directory: cloudflare
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4.166.0 whoami
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Require isolated schema and authenticated API restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/cloudflare-d1-restore-rehearsal.yml"
          for attempt in $(seq 1 720); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="migration/cloudflare-auth-consolidation" -F per_page=100)"
            chosen="$(jq -r --arg path "$workflow_path" '
              [.workflow_runs[] | select(.path == $path and .head_branch == "migration/cloudflare-auth-consolidation")]
              | sort_by(.created_at) | reverse | .[0] // empty
              | [.id,.head_sha,.status,(.conclusion // "")] | @tsv
            ' <<< "$runs")"
            if [[ -n "$chosen" ]]; then
              IFS=$'\t' read -r run_id sha status conclusion <<< "$chosen"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "::error title=Isolated restore failed::The isolated schema and authenticated API rehearsal concluded $conclusion."
                  exit 1
                fi
                if ! git cat-file -e "${sha}^{commit}" 2>/dev/null ||
                   ! git diff --quiet "$sha" "$GITHUB_SHA" -- cloudflare/src cloudflare/migrations cloudflare/package.json cloudflare/package-lock.json cloudflare/wrangler.toml; then
                  echo "::error title=Stale restore evidence::The successful restore run does not match the current Worker/schema source."
                  exit 1
                fi
                echo "Isolated EU schema and authenticated API restore passed (run $run_id)."
                break
              fi
            fi
            if [[ "$attempt" -eq 720 ]]; then
              echo "::error title=Isolated restore timeout::No successful current-source restore rehearsal completed within six hours."
              exit 1
            fi
            sleep 30
          done

      - name: Require production-data clone and Time Travel restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/cloudflare-production-data-restore-rehearsal.yml"
          for attempt in $(seq 1 720); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="migration/cloudflare-auth-consolidation" -F per_page=100)"
            chosen="$(jq -r --arg path "$workflow_path" '
              [.workflow_runs[] | select(.path == $path and .head_branch == "migration/cloudflare-auth-consolidation")]
              | sort_by(.created_at) | reverse | .[0] // empty
              | [.id,.head_sha,.status,(.conclusion // "")] | @tsv
            ' <<< "$runs")"
            if [[ -n "$chosen" ]]; then
              IFS=$'\t' read -r run_id sha status conclusion <<< "$chosen"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "::error title=Production-data recovery failed::The production-data clone/restore rehearsal concluded $conclusion."
                  exit 1
                fi
                if ! git cat-file -e "${sha}^{commit}" 2>/dev/null ||
                   ! git diff --quiet "$sha" "$GITHUB_SHA" -- cloudflare/src cloudflare/migrations cloudflare/package.json cloudflare/package-lock.json cloudflare/wrangler.toml; then
                  echo "::error title=Stale production-data evidence::The clone/restore run does not match the current Worker/schema source."
                  exit 1
                fi
                echo "Production data clone and Time Travel restore passed (run $run_id)."
                break
              fi
            fi
            if [[ "$attempt" -eq 720 ]]; then
              echo "::error title=Production-data recovery timeout::No successful current-source clone/restore completed within six hours."
              exit 1
            fi
            sleep 30
          done

      - name: Require current-source D1 and frontend CI to pass
        shell: bash
        run: |
          set -euo pipefail
          require_green() {
            local workflow_path="$1"
            local label="$2"
            local scope="$3"
            local accepted=""
            for attempt in $(seq 1 120); do
              runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="migration/cloudflare-auth-consolidation" -F per_page=100)"
              while IFS= read -r sha; do
                [[ -z "$sha" ]] && continue
                if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then continue; fi
                if git diff --quiet "$sha" "$GITHUB_SHA" -- "$scope"; then
                  accepted="$sha"
                  break
                fi
              done < <(jq -r --arg path "$workflow_path" '.workflow_runs[] | select(.path == $path and .conclusion == "success") | .head_sha' <<< "$runs")
              if [[ -n "$accepted" ]]; then
                echo "$label passed at $accepted; its $scope source tree is unchanged at cleanup commit $GITHUB_SHA."
                return 0
              fi
              sleep 20
            done
            echo "::error title=Current-source CI timeout::$label has no successful run for the exact current $scope source tree."
            return 1
          }
          require_green ".github/workflows/cloudflare-d1-foundation.yml" "Cloudflare D1 Foundation" "cloudflare"
          require_green ".github/workflows/cmi-web-ci.yml" "CMI web CI" "web"

      - name: Capture the production D1 recovery bookmark
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info pcg-missions-production --env production --json > /tmp/pcg-test-cleanup-bookmark-before.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/pcg-test-cleanup-bookmark-before.json", "utf8"));
          if (!JSON.stringify(data).toLowerCase().includes("bookmark")) throw new Error("No production D1 Time Travel bookmark was returned.");
          console.log("Production D1 recovery bookmark recorded before the forward migration and test-account cleanup.");
          NODE

      - name: Verify the exact owner and test identities before mutation
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "
            SELECT
              (SELECT COUNT(*) FROM staff_profile sp JOIN user u ON u.id=sp.auth_user_id
                JOIN account a ON a.userId=u.id AND a.providerId='credential' AND a.password IS NOT NULL
                JOIN staff_role_assignment ra ON ra.staff_profile_id=sp.id AND ra.revoked_at IS NULL
                JOIN role r ON r.id=ra.role_id AND r.code='admin_pastor'
                WHERE sp.id='ff3da224-34df-4702-93fd-6011cc52e4e9'
                  AND u.id='ed68338d-3edd-4720-a30a-16f590c8ada2'
                  AND u.email='elviskwakuboateng63@gmail.com'
                  AND sp.account_status='active' AND sp.deactivated_at IS NULL) AS owner_ready,
              (SELECT COUNT(*) FROM user WHERE
                (id='a75f19b8-be85-4a90-835c-d8848bad8bc1' AND email IN ('eltech6363@gmail.com','removed+a75f19b8-be85-4a90-835c-d8848bad8bc1@invalid.example'))
                OR (id='b831e1e5-e2f5-4257-bd90-e7c84c4e6c91' AND email IN ('nanaseiboateng15@gmail.com','removed+b831e1e5-e2f5-4257-bd90-e7c84c4e6c91@invalid.example'))) AS exact_test_users,
              (SELECT COUNT(*) FROM staff_profile WHERE id IN
                ('d5c922ca-0e64-4a65-b14e-128c9131f79c','d9c55d3f-ec29-457f-a131-621a72d326e9')) AS exact_test_profiles,
              (SELECT COUNT(*) FROM contact_assignment WHERE assignee_user_id IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')
                AND (ends_at IS NULL OR datetime(ends_at)>datetime('now'))) AS active_contact_assignments,
              (SELECT COUNT(*) FROM followup_task WHERE assignee_user_id IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')
                AND status IN ('open','in_progress')) AS active_followup_tasks,
              (SELECT COUNT(*) FROM prayer_assignment WHERE intercessor_user_id IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')
                AND revoked_at IS NULL AND (ends_at IS NULL OR datetime(ends_at)>datetime('now'))) AS active_prayer_assignments,
              (SELECT COUNT(*) FROM care_assignment WHERE assignee_user_id IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')
                AND revoked_at IS NULL AND (ends_at IS NULL OR datetime(ends_at)>datetime('now'))) AS active_care_assignments,
              (SELECT COUNT(*) FROM event_staff_assignment WHERE staff_auth_user_id IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')
                AND revoked_at IS NULL AND (ends_at IS NULL OR datetime(ends_at)>datetime('now'))) AS active_event_assignments
          " > /tmp/pcg-test-cleanup-preflight.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = JSON.parse(fs.readFileSync("/tmp/pcg-test-cleanup-preflight.json", "utf8"));
          const rows = [];
          function visit(v) {
            if (!v || typeof v !== "object") return;
            if (Array.isArray(v)) return v.forEach(visit);
            if (Object.hasOwn(v, "owner_ready")) rows.push(v);
            Object.values(v).forEach(visit);
          }
          visit(root);
          const r = rows[0];
          if (!r || Number(r.owner_ready)!==1 || Number(r.exact_test_users)!==2 ||
              Number(r.exact_test_profiles)!==2 || Number(r.active_contact_assignments)!==0 ||
              Number(r.active_followup_tasks)!==0 || Number(r.active_prayer_assignments)!==0 ||
              Number(r.active_care_assignments)!==0 || Number(r.active_event_assignments)!==0) {
            throw new Error("Production cleanup preflight did not match the two approved test accounts and preserved owner.");
          }
          console.log("Preflight verified: owner Admin/Pastor is credential-ready; exactly the two requested test identities are targeted; no active ministry assignments will be orphaned.");
          NODE

      - name: Apply the reviewed forward-only D1 migrations after UTC quota reset
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          wait_for_quota_reset() {
            reset_at="$(date -u -d 'today 00:05:00' +%s)"
            now="$(date -u +%s)"
            if [[ "$reset_at" -le "$now" ]]; then
              reset_at="$(date -u -d 'tomorrow 00:05:00' +%s)"
            fi
            wait_seconds=$((reset_at-now))
            if [[ "$wait_seconds" -le 0 || "$wait_seconds" -gt 18000 ]]; then
              echo "::error title=D1 write quota exhausted::Retry the production maintenance workflow after the UTC reset or move to paid D1 capacity."
              return 1
            fi
            echo "::warning title=Cloudflare D1 daily write cap::Waiting until 00:05 UTC before retrying the same forward-only migration."
            sleep "$wait_seconds"
          }
          set +e
          npx wrangler d1 migrations apply pcg-missions-production --remote --env production 2>&1 | tee /tmp/pcg-test-cleanup-migrations.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] && grep -Eiq "7500|daily row write limit|free tier" /tmp/pcg-test-cleanup-migrations.log; then
            wait_for_quota_reset
            npx wrangler d1 migrations apply pcg-missions-production --remote --env production
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "SELECT schema_version,environment,(SELECT COUNT(*) FROM d1_migrations) AS migration_count,(SELECT MAX(id) FROM d1_migrations) AS latest_migration_id FROM app_meta WHERE id=1" > /tmp/pcg-test-cleanup-schema.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root=JSON.parse(fs.readFileSync("/tmp/pcg-test-cleanup-schema.json","utf8"));
          const rows=[];
          function visit(v){if(!v||typeof v!=="object")return;if(Array.isArray(v))return v.forEach(visit);if(Object.hasOwn(v,"schema_version"))rows.push(v);Object.values(v).forEach(visit);}
          visit(root);
          const r=rows[0];
          if(!r||r.environment!=="production"||Number(r.schema_version)!==47||Number(r.migration_count)!==47||Number(r.latest_migration_id)!==47)throw new Error("Production D1 did not reach the verified schema 47 migration ledger.");
          console.log("Production D1 is schema 47 with all 47 migrations recorded.");
          NODE

      - name: Remove only the two test credentials and free their original email addresses
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx wrangler d1 execute pcg-missions-production --remote --env production --file ./scripts/remove_test_staff_logins.sql 2>&1 | tee /tmp/pcg-test-cleanup-write.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] && grep -Eiq "7500|daily row write limit|free tier" /tmp/pcg-test-cleanup-write.log; then
            reset_at="$(date -u -d 'today 00:05:00' +%s)"
            now="$(date -u +%s)"
            if [[ "$reset_at" -le "$now" ]]; then reset_at="$(date -u -d 'tomorrow 00:05:00' +%s)"; fi
            wait_seconds=$((reset_at-now))
            if [[ "$wait_seconds" -le 0 || "$wait_seconds" -gt 18000 ]]; then
              echo "::error title=D1 write quota exhausted::Cleanup remains unchanged or safely retryable; rerun after the next UTC quota reset."
              exit 1
            fi
            echo "::warning title=Cloudflare D1 daily write cap::Waiting until 00:05 UTC and retrying the idempotent cleanup file."
            sleep "$wait_seconds"
            npx wrangler d1 execute pcg-missions-production --remote --env production --file ./scripts/remove_test_staff_logins.sql
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Verify owner access, released emails, preserved tombstones and foreign keys
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "
            SELECT
              (SELECT COUNT(*) FROM staff_profile sp JOIN user u ON u.id=sp.auth_user_id
                JOIN account a ON a.userId=u.id AND a.providerId='credential' AND a.password IS NOT NULL
                JOIN staff_role_assignment ra ON ra.staff_profile_id=sp.id AND ra.revoked_at IS NULL
                JOIN role r ON r.id=ra.role_id AND r.code='admin_pastor'
                WHERE sp.id='ff3da224-34df-4702-93fd-6011cc52e4e9'
                  AND u.id='ed68338d-3edd-4720-a30a-16f590c8ada2'
                  AND u.email='elviskwakuboateng63@gmail.com'
                  AND sp.account_status='active' AND sp.deactivated_at IS NULL) AS owner_ready,
              (SELECT COUNT(*) FROM user WHERE email IN ('eltech6363@gmail.com','nanaseiboateng15@gmail.com')) AS original_login_emails,
              (SELECT COUNT(*) FROM staff_profile WHERE email IN ('eltech6363@gmail.com','nanaseiboateng15@gmail.com')) AS original_profile_emails,
              (SELECT COUNT(*) FROM staff_profile WHERE id IN
                ('d5c922ca-0e64-4a65-b14e-128c9131f79c','d9c55d3f-ec29-457f-a131-621a72d326e9')
                AND account_status='inactive' AND deactivated_at IS NOT NULL
                AND full_name='Removed test account' AND email IS NULL) AS anonymized_profiles,
              (SELECT COUNT(*) FROM account WHERE userId IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')) AS remaining_credentials,
              (SELECT COUNT(*) FROM session WHERE userId IN
                ('a75f19b8-be85-4a90-835c-d8848bad8bc1','b831e1e5-e2f5-4257-bd90-e7c84c4e6c91')) AS remaining_sessions,
              (SELECT COUNT(*) FROM staff_role_assignment WHERE staff_profile_id IN
                ('d5c922ca-0e64-4a65-b14e-128c9131f79c','d9c55d3f-ec29-457f-a131-621a72d326e9')
                AND revoked_at IS NULL) AS active_test_role_assignments,
              (SELECT COUNT(*) FROM staff_access_audit WHERE id LIKE 'owner-test-login-removal-complete-%') AS completion_audits,
              (SELECT COUNT(*) FROM staff_account_audit WHERE target_profile_id IN
                ('d5c922ca-0e64-4a65-b14e-128c9131f79c','d9c55d3f-ec29-457f-a131-621a72d326e9')
                AND action='account_deactivated') AS account_deactivation_audits,
              (SELECT schema_version FROM app_meta WHERE id=1) AS schema_version,
              (SELECT environment FROM app_meta WHERE id=1) AS environment
          " > /tmp/pcg-test-cleanup-after.json
          npx wrangler d1 execute pcg-missions-production --remote --env production --json --command "PRAGMA foreign_key_check" > /tmp/pcg-test-cleanup-foreign-keys.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root=JSON.parse(fs.readFileSync("/tmp/pcg-test-cleanup-after.json","utf8"));
          const rows=[];
          function visit(v){if(!v||typeof v!=="object")return;if(Array.isArray(v))return v.forEach(visit);if(Object.hasOwn(v,"owner_ready"))rows.push(v);Object.values(v).forEach(visit);}
          visit(root);
          const r=rows[0];
          if(!r||Number(r.owner_ready)!==1||Number(r.original_login_emails)!==0||Number(r.original_profile_emails)!==0||
             Number(r.anonymized_profiles)!==2||Number(r.remaining_credentials)!==0||Number(r.remaining_sessions)!==0||
             Number(r.active_test_role_assignments)!==0||Number(r.completion_audits)!==2||
             Number(r.account_deactivation_audits)<2||Number(r.schema_version)!==47||r.environment!=="production") {
            throw new Error("Test-account cleanup verification failed; review retained evidence before any retry.");
          }
          const fk=JSON.parse(fs.readFileSync("/tmp/pcg-test-cleanup-foreign-keys.json","utf8"));
          const violations=[];
          function collect(v){if(!v||typeof v!=="object")return;if(Array.isArray(v))return v.forEach(collect);if(Object.hasOwn(v,"table")&&Object.hasOwn(v,"parent"))violations.push(v);Object.values(v).forEach(collect);}
          collect(fk);
          if(violations.length)throw new Error("Production D1 reports foreign-key violations after account cleanup.");
          console.log("Verified: owner/Admin-Pastor sign-in remains provisioned; both test logins are disabled; original emails are released; audit/ministry history is retained; no foreign-key violations.");
          NODE

      - name: Retain production cleanup evidence and recovery bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcg-missions-test-account-cleanup-${{ github.run_id }}
          path: |
            /tmp/pcg-test-cleanup-bookmark-before.json
            /tmp/pcg-test-cleanup-preflight.json
            /tmp/pcg-test-cleanup-schema.json
            /tmp/pcg-test-cleanup-after.json
            /tmp/pcg-test-cleanup-foreign-keys.json
          if-no-files-found: warn
          retention-days: 90
