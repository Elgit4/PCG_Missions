name: RETIRED — Legacy Cloudflare Preview Bundle

# Superseded by cloudflare-preview-deploy.yml, which builds, deploys, and verifies
# the exact migration-branch Worker bundle against preview D1 schema 46.
# Retained as an audit artifact so the old feature/artifact branches cannot
# accidentally publish a stale Worker or assert an obsolete schema version.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retired preview bundle workflow
        run: |
          echo "This legacy bundle workflow is retired."
          echo "Use .github/workflows/cloudflare-preview-deploy.yml for the current preview release."
          echo "No D1, Worker, Pages, Supabase or SMS changes were made."
