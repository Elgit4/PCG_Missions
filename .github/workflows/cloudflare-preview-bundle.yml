name: Cloudflare Preview Worker Bundle
# This workflow validates the live preview endpoint (including the v43 rehearsal schema) and Pages bundle; it does not deploy or alter production.
# Keep the smoke step after Pages environment changes to verify build-time configuration and route access boundaries.

on:
  push:
    branches:
      - feat/cloudflare-d1-migration-foundation
    paths:
      - "cloudflare/**"
      - "web/**"
      - ".github/workflows/cloudflare-preview-bundle.yml"
      - ".github/workflows/cloudflare-preview-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcg-missions-preview-worker-bundle
  cancel-in-progress: true

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-d1-migration-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Type-check Worker
        run: npm run typecheck

      - name: Test Worker authentication and routes
        run: npm test

      - name: Bundle preview Worker without deploying
        run: |
          rm -rf dist
          npx wrangler deploy --env preview --dry-run --outdir dist
          test -s dist/index.js
          node --check dist/index.js

      - name: Smoke-test deployed preview Worker
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          health="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$url/health")"
          echo "$health"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.ok!==true || p.environment!=="non-production" || p.schema_version!==43) process.exit(1)' "$health"
          status="$(curl --silent --show-error -o /tmp/me.json -w "%{http_code}" "$url/api/v1/me")"
          cat /tmp/me.json
          test "$status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/me.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          contact_status="$(curl --silent --show-error -o /tmp/contact.json -w "%{http_code}" "$url/api/v1/contacts/10000000-0000-4000-8000-000000000001")"
          cat /tmp/contact.json
          test "$contact_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/contact.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          contact_update_status="$(curl --silent --show-error -o /tmp/contact-update.json -w "%{http_code}" -X PATCH "$url/api/v1/contacts/10000000-0000-4000-8000-000000000001" -H "Content-Type: application/json" --data '{"first_name":"Preview smoke"}')"
          cat /tmp/contact-update.json
          test "$contact_update_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/contact-update.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          contact_create_status="$(curl --silent --show-error -o /tmp/contact-create.json -w "%{http_code}" -X POST "$url/api/v1/contacts" -H "Content-Type: application/json" -H "Idempotency-Key: preview-capture-request-123456" --data '{"first_name":"Preview smoke"}')"
          cat /tmp/contact-create.json
          test "$contact_create_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/contact-create.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          interaction_read_status="$(curl --silent --show-error -o /tmp/interaction-read.json -w "%{http_code}" "$url/api/v1/contacts/10000000-0000-4000-8000-000000000001/interactions")"
          cat /tmp/interaction-read.json
          test "$interaction_read_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/interaction-read.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          interaction_status="$(curl --silent --show-error -o /tmp/interaction.json -w "%{http_code}" -X POST "$url/api/v1/contacts/10000000-0000-4000-8000-000000000001/interactions" -H "Content-Type: application/json" --data '{"interaction_type":"call"}')"
          cat /tmp/interaction.json
          test "$interaction_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/interaction.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          task_read_status="$(curl --silent --show-error -o /tmp/task-read.json -w "%{http_code}" "$url/api/v1/followup/tasks")"
          cat /tmp/task-read.json
          test "$task_read_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/task-read.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          task_create_status="$(curl --silent --show-error -o /tmp/task-create.json -w "%{http_code}" -X POST "$url/api/v1/followup/tasks" -H "Content-Type: application/json" --data '{"branch_id":"30000000-0000-4000-8000-000000000001","contact_id":"80000000-0000-4000-8000-000000000001","client_request_id":"90000000-0000-4000-8000-000000000001","assignee_user_id":"10000000-0000-4000-8000-000000000001","priority":2}')"
          cat /tmp/task-create.json
          test "$task_create_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/task-create.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          task_update_status="$(curl --silent --show-error -o /tmp/task-update.json -w "%{http_code}" -X PATCH "$url/api/v1/followup/tasks/90000000-0000-4000-8000-000000000002" -H "Content-Type: application/json" --data '{"status":"in_progress"}')"
          cat /tmp/task-update.json
          test "$task_update_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/task-update.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          task_assign_status="$(curl --silent --show-error -o /tmp/task-assign.json -w "%{http_code}" -X POST "$url/api/v1/followup/tasks/90000000-0000-4000-8000-000000000002/assign" -H "Content-Type: application/json" --data '{"assignee_profile_id":"20000000-0000-4000-8000-000000000002","reason":"Rebalance the follow-up workload"}')"
          cat /tmp/task-assign.json
          test "$task_assign_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/task-assign.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          for route in "teams" "areas"; do
            status="$(curl --silent --show-error -o "/tmp/$route.json" -w "%{http_code}" "$url/api/v1/$route?branch_id=00000000-0000-4000-8000-000000000001")"
            cat "/tmp/$route.json"
            test "$status" = "401"
            node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)' "/tmp/$route.json"
          done
          branch="00000000-0000-4000-8000-000000000001"
          for path in "/api/v1/calendar/entries?branch_id=$branch" "/api/v1/announcements?branch_id=$branch"; do
            status="$(curl --silent --show-error -o /tmp/new-route-read.json -w "%{http_code}" "$url$path")"
            cat /tmp/new-route-read.json
            test "$status" = "401"
            node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/new-route-read.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          done
          calendar_create_status="$(curl --silent --show-error -o /tmp/calendar-create.json -w "%{http_code}" -X POST "$url/api/v1/calendar/entries" -H "Content-Type: application/json" --data "{\"branch_id\":\"$branch\",\"entry_type\":\"service\",\"title\":\"Preview smoke\",\"starts_at\":\"2026-11-29T09:00:00+00:00\"}")"
          cat /tmp/calendar-create.json
          test "$calendar_create_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/calendar-create.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          calendar_update_status="$(curl --silent --show-error -o /tmp/calendar-update.json -w "%{http_code}" -X PATCH "$url/api/v1/calendar/entries/10000000-0000-4000-8000-000000000001?branch_id=$branch" -H "Content-Type: application/json" --data '{"title":"Preview smoke"}')"
          cat /tmp/calendar-update.json
          test "$calendar_update_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/calendar-update.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          announcement_create_status="$(curl --silent --show-error -o /tmp/announcement-create.json -w "%{http_code}" -X POST "$url/api/v1/announcements" -H "Content-Type: application/json" --data "{\"branch_id\":\"$branch\",\"title\":\"Preview smoke\",\"body\":\"Preview route probe\"}")"
          cat /tmp/announcement-create.json
          test "$announcement_create_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/announcement-create.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          announcement_update_status="$(curl --silent --show-error -o /tmp/announcement-update.json -w "%{http_code}" -X PATCH "$url/api/v1/announcements/10000000-0000-4000-8000-000000000001?branch_id=$branch" -H "Content-Type: application/json" --data '{"title":"Preview smoke"}')"
          cat /tmp/announcement-update.json
          test "$announcement_update_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/announcement-update.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          node --input-type=module <<'NODE'
          const origin = "https://feat-cloudflare-d1-migration.pcg-missions.pages.dev";
          const workerUrl = "https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev";
          const response = await fetch(`${workerUrl}/api/v1/contacts`, {
            method: "OPTIONS",
            headers: {
              Origin: origin,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "authorization,content-type,x-branch-id,idempotency-key",
            },
          });
          const headers = Object.fromEntries(response.headers.entries());
          console.log(JSON.stringify({ status: response.status, headers }));
          if (response.status !== 204 || headers["access-control-allow-origin"] !== origin ||
              !headers["access-control-allow-headers"]?.toLowerCase().includes("idempotency-key")) {
            throw new Error("Preview Worker CORS preflight did not return the configured origin and request headers.");
          }
          NODE

      - name: Verify team and service-area mutation routes are live and protected
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          branch="00000000-0000-4000-8000-000000000001"
          team="00000000-0000-4000-8000-000000000002"
          area="00000000-0000-4000-8000-000000000003"
          member="00000000-0000-4000-8000-000000000004"
          staff="00000000-0000-4000-8000-000000000005"
          coverage="00000000-0000-4000-8000-000000000006"
          assert_unauth() {
            method="$1"; path="$2"; body="${3:-}"
            if [[ -n "$body" ]]; then
              status="$(curl --silent --show-error -o /tmp/route.json -w "%{http_code}" -X "$method" "$url$path" -H "Content-Type: application/json" --data "$body")"
            else
              status="$(curl --silent --show-error -o /tmp/route.json -w "%{http_code}" -X "$method" "$url$path")"
            fi
            test "$status" = "401"
            node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/route.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          }
          assert_unauth POST "/api/v1/teams" "{\"branch_id\":\"$branch\",\"name\":\"Welcome\",\"description\":null}"
          assert_unauth PATCH "/api/v1/teams/$team?branch_id=$branch" '{"is_active":false}'
          assert_unauth POST "/api/v1/teams/$team/members?branch_id=$branch" "{\"staff_profile_id\":\"$staff\",\"membership_role\":\"member\"}"
          assert_unauth PATCH "/api/v1/teams/$team/members/$member?branch_id=$branch" '{"membership_role":"leader"}'
          assert_unauth POST "/api/v1/teams/$team/members/$member/revoke?branch_id=$branch"
          assert_unauth POST "/api/v1/areas" "{\"branch_id\":\"$branch\",\"name\":\"Tema West\",\"code\":\"TEMA-W\"}"
          assert_unauth PATCH "/api/v1/areas/$area?branch_id=$branch" '{"is_active":false}'
          assert_unauth POST "/api/v1/areas/$area/coverage?branch_id=$branch" "{\"staff_profile_id\":\"$staff\"}"
          assert_unauth POST "/api/v1/areas/$area/coverage/$coverage/revoke?branch_id=$branch"
          event="40000000-0000-4000-8000-000000000001"
          registration="50000000-0000-4000-8000-000000000001"
          assert_unauth GET "/api/v1/reports?branch_id=$branch"
          assert_unauth POST "/api/v1/reports?branch_id=$branch" '{"branch_id":"00000000-0000-4000-8000-000000000001","report_type":"daily_evangelism","period_start":"2026-11-22","period_end":"2026-11-22"}'
          assert_unauth GET "/api/v1/reports/teams?branch_id=$branch"
          assert_unauth GET "/api/v1/reports/events?branch_id=$branch"
          assert_unauth GET "/api/v1/events/$event/registrations?branch_id=$branch"
          assert_unauth POST "/api/v1/events/$event/registrations?branch_id=$branch" '{"idempotency_key":"registration-key-123","attendee_name":"Preview attendee","attendee_phone":null}'
          assert_unauth POST "/api/v1/events/$event/registrations/$registration/check-in?branch_id=$branch" '{"idempotency_key":"checkin-key-123"}'
          assert_unauth POST "/api/v1/events/$event/registrations/$registration/cancel?branch_id=$branch" '{"idempotency_key":"cancel-key-123"}'
          assert_unauth GET "/api/v1/events/$event/closeout?branch_id=$branch"
          assert_unauth POST "/api/v1/events/$event/closeout/submit?branch_id=$branch" '{"idempotency_key":"closeout-key-123","summary_notes":null}'
          assert_unauth POST "/api/v1/events/$event/closeout/review?branch_id=$branch" '{"idempotency_key":"review-key-123","decision":"approved","reason":null}'
          assert_unauth POST "/api/v1/events/$event/staff-registration/open?branch_id=$branch"
          assert_unauth POST "/api/v1/staff/$staff/deactivate?branch_id=$branch" '{"reason":"Preview anonymous access probe"}'
          assert_unauth POST "/api/v1/staff/$staff/reactivate?branch_id=$branch" '{"reason":"Preview anonymous access probe"}'
          assert_unauth GET "/api/v1/pastoral/prayer/assigned?limit=10&offset=0"
          echo "All team, service-area, ministry-report, event-lifecycle and prayer-inbox routes reject anonymous access."
 
      - name: Verify password recovery routes on the current preview Worker and fail closed
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          email="pcg-preview-smoke-${GITHUB_RUN_ID}@invalid.example"
          printf '{"email":"%s"}' "$email" > /tmp/password-reset-body.json
          request_status="$(curl --silent --show-error -o /tmp/password-reset-request.json -w "%{http_code}" -X POST "$url/api/v1/auth/password-reset-requests" -H "Content-Type: application/json" --data-binary @/tmp/password-reset-body.json)"
          cat /tmp/password-reset-request.json
          test "$request_status" = "200"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/password-reset-request.json","utf8")); if(p.ok!==true || typeof p.message!=="string") process.exit(1)'
          change_status="$(curl --silent --show-error -o /tmp/password-change.json -w "%{http_code}" -X POST "$url/api/v1/auth/password/change" -H "Content-Type: application/json" --data '{}')"
          cat /tmp/password-change.json
          test "$change_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/password-change.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          list_status="$(curl --silent --show-error -o /tmp/password-reset-list.json -w "%{http_code}" "$url/api/v1/admin/password-reset-requests")"
          cat /tmp/password-reset-list.json
          test "$list_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/password-reset-list.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          approve_status="$(curl --silent --show-error -o /tmp/password-reset-approve.json -w "%{http_code}" -X POST "$url/api/v1/admin/password-reset-requests/00000000-0000-4000-8000-000000000001/approve" -H "Content-Type: application/json" --data '{}')"
          cat /tmp/password-reset-approve.json
          test "$approve_status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/password-reset-approve.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'
          echo "Current deployed preview Worker: public reset request is non-enumerating; password change and Admin reset operations reject anonymous access."
          
      - name: Verify Pages preview was built with the Worker API origin
        shell: bash
        run: |
          set -euo pipefail
          page="https://feat-cloudflare-d1-migration.pcg-missions.pages.dev"
          html="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$page")"
          asset="$(grep -oE 'src="[^"]+\.js"' <<< "$html" | head -n1 | cut -d '"' -f2)"
          echo "Pages preview JavaScript asset: $asset"
          test -n "$asset"
          if [[ "$asset" == http* ]]; then js_url="$asset"; else js_url="$page$asset"; fi
          bundle="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$js_url")"
          if ! grep -Fq "pcg-missions-api-preview.pcg-missions-nonprod.workers.dev" <<< "$bundle"; then
            echo "Worker API origin was not embedded in the preview bundle."
            exit 1
          fi
          if ! grep -Fq "PREVIEW_OPERATION_NOT_MIGRATED" <<< "$bundle"; then
            echo "Preview write-isolation guard was not embedded in the Pages JavaScript."
            exit 1
          fi
          echo "Pages preview HTML and JavaScript respond; Worker API origin and preview write-isolation guard are embedded."

      - name: Publish immutable bundle branch for direct Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pcg-worker-bundle
          cp cloudflare/dist/index.js /tmp/pcg-worker-bundle/index.js
          cp .github/workflows/cloudflare-preview-smoke.yml /tmp/pcg-worker-bundle/cloudflare-preview-smoke.yml
          cat > /tmp/pcg-worker-bundle/build-info.json <<EOF
          {
            "source_branch": "feat/cloudflare-d1-migration-foundation",
            "source_commit": "${GITHUB_SHA}",
            "built_at": "${GITHUB_RUN_ID}",
            "worker_name": "pcg-missions-api-preview",
            "database_id": "74074d53-1edc-4ad7-83e6-bb3333a6ab4f",
            "environment": "non-production"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan artifacts/pcg-missions-preview-worker
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p worker .github/workflows
          cp /tmp/pcg-worker-bundle/index.js worker/index.js
          cp /tmp/pcg-worker-bundle/build-info.json worker/build-info.json
          cp /tmp/pcg-worker-bundle/cloudflare-preview-smoke.yml .github/workflows/cloudflare-preview-smoke.yml
          git add worker/index.js worker/build-info.json .github/workflows/cloudflare-preview-smoke.yml
          git commit -m "build: publish verified PCG Missions preview Worker bundle [skip ci]"
          git push --force origin HEAD:refs/heads/artifacts/pcg-missions-preview-worker

      - name: Upload bundle for audit
        uses: actions/upload-artifact@v4
        with:
          name: pcg-missions-preview-worker-${{ github.sha }}
          path: cloudflare/dist/index.js
          if-no-files-found: error
          retention-days: 14
