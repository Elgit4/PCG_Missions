name: Cloudflare Worker Preview Deploy

on:
  push:
    branches:
      - feat/cloudflare-d1-migration-foundation
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-preview-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcg-missions-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feat/cloudflare-d1-migration-foundation'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: "1697f36d4227453d2e25cfb49b347e5f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-d1-migration-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Type-check Worker
        run: npm run typecheck

      - name: Test Supabase Auth integration
        run: npm test

      - name: Check Cloudflare deployment token
        id: token-check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Preview deployment skipped: CLOUDFLARE_API_TOKEN is not configured."
          fi

      - name: Deploy isolated preview Worker
        if: steps.token-check.outputs.available == 'true'
        run: npm run deploy:preview
