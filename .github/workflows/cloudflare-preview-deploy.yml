name: Cloudflare Worker Preview Deploy (credential-based fallback)

# The preview Worker is currently deployed through the connected Cloudflare
# account after the verified bundle is produced by cloudflare-preview-bundle.yml.
# Keep this credential-based workflow manual until GitHub secret scope is repaired.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcg-missions-cloudflare-preview-credential-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: "1697f36d4227453d2e25cfb49b347e5f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-d1-migration-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare token unavailable::CLOUDFLARE_API_TOKEN is not injected into this manually triggered job. The preview bundle and live smoke checks run in Cloudflare Preview Worker Bundle."
            exit 1
          fi

      - name: Verify Cloudflare account access
        run: npx wrangler whoami

      - name: Deploy isolated preview Worker
        run: npm run deploy:preview
