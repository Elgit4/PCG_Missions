name: PCG Missions Availability Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-d1-migration-foundation
    paths:
      - ".github/workflows/pcg-missions-availability-monitor.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: pcg-missions-availability-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check live Pages and non-production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check current public Pages production site
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions.pages.dev/"
          status="$(curl --location --silent --show-error --output /tmp/pages.html --write-out "%{http_code}" --max-time 30 "$url")"
          echo "Pages HTTP status: $status"
          test "$status" = "200"
          grep -Eiq "PCG Missions|PCG" /tmp/pages.html

      - name: Check preview Worker health and schema marker
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
          body="$(curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error --max-time 20 "$url/health")"
          echo "$body"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.ok!==true || p.environment!=="non-production" || p.schema_version!==43) { console.error("Preview Worker health/schema mismatch"); process.exit(1); }' "$body"

      - name: Check authentication boundary remains closed
        shell: bash
        run: |
          set -euo pipefail
          url="https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev/api/v1/me"
          status="$(curl --silent --show-error --output /tmp/me.json --write-out "%{http_code}" --max-time 20 "$url")"
          cat /tmp/me.json
          test "$status" = "401"
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/me.json","utf8")); if(p.error?.code!=="UNAUTHENTICATED") process.exit(1)'

      - name: Publish monitoring result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## PCG Missions availability monitor"
            echo ""
            echo "- Result: **${JOB_STATUS}**"
            echo "- Public Pages: https://pcg-missions.pages.dev/"
            echo "- Preview Worker: https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev/health"
            echo "- Scope: read-only HTTP checks; no database writes, credential changes, production routing changes, or SMS sends."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a monitoring incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "PCG Missions availability monitor failure";
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = open.data.find(issue => issue.title === title && !issue.pull_request);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled/manual PCG Missions availability monitor detected a failed check.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              "",
              "Inspect the failing step and recent Cloudflare Pages/Workers deployments. This monitor is read-only and does not authorize production cutover.",
              "",
              "The monitor checks the current public Pages site and the non-production preview Worker. It does not imply that a production application Worker exists."
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Additional monitor failure: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body
              });
            }
