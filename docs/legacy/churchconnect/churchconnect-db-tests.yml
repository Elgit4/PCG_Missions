name: ChurchConnect database tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/churchconnect-db-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/churchconnect-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churchconnect-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Migrations and pgTAP authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
