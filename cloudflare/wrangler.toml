name = "pcg-missions-api-nonprod"
main = "src/index.ts"
compatibility_date = "2026-11-21"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
APP_ENV = "non-production"
APP_ALLOWED_ORIGINS = "https://pcg-missions.pages.dev,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "pcg-missions-dev"
# Non-production D1 created with jurisdiction = "eu".
# Never replace this with a production database ID.
database_id = "376a6782-d059-41f9-9e09-f93718fef2bb"
migrations_dir = "migrations"
