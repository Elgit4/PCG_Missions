name = "pcg-missions-api-nonprod"
main = "src/index.ts"
compatibility_date = "2026-11-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_ENV = "non-production"

[[d1_databases]]
binding = "DB"
database_name = "pcg-missions-dev"
