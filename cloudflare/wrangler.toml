name = "pcg-missions-api-nonprod"
main = "src/worker.ts"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
APP_ENV = "non-production"
APP_ALLOWED_ORIGINS = "http://localhost:5173"

[[kv_namespaces]]
binding = "EVENT_MEDIA"
id = "4c1b4d0c6066440ebdabfa75fd935dfe"

[[d1_databases]]
binding = "DB"
database_name = "pcg-missions-dev"
database_id = "376a6782-d059-41f9-9e09-f93718fef2bb"
migrations_dir = "migrations"

[env.preview]
name = "pcg-missions-api-preview"
workers_dev = true

[env.preview.vars]
APP_ENV = "non-production"
APP_ALLOWED_ORIGINS = "https://migration-cloudflare-auth-co.pcg-missions.pages.dev,https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
BETTER_AUTH_URL = "https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"
BETTER_AUTH_TRUSTED_ORIGINS = "https://migration-cloudflare-auth-co.pcg-missions.pages.dev,https://pcg-missions-api-preview.pcg-missions-nonprod.workers.dev"

[[env.preview.kv_namespaces]]
binding = "EVENT_MEDIA"
id = "4c1b4d0c6066440ebdabfa75fd935dfe"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "pcg-missions-migration-test"
database_id = "74074d53-1edc-4ad7-83e6-bb3333a6ab4f"
migrations_dir = "migrations"

[env.production]
name = "pcg-missions-api-production"
workers_dev = true

[env.production.vars]
APP_ENV = "production"
APP_ALLOWED_ORIGINS = "https://pcg-missions.pages.dev"
BETTER_AUTH_URL = "https://pcg-missions-api-production.pcg-missions-nonprod.workers.dev"
BETTER_AUTH_TRUSTED_ORIGINS = "https://pcg-missions.pages.dev,https://pcg-missions-api-production.pcg-missions-nonprod.workers.dev"

[[env.production.kv_namespaces]]
binding = "EVENT_MEDIA"
id = "4c1b4d0c6066440ebdabfa75fd935dfe"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pcg-missions-production"
database_id = "2bbfb04f-9182-427d-b269-d050b8a9403f"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["*/15 * * * *"]
